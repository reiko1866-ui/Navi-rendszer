<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 640 640">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#D7EFE4"/>
      <stop offset="0.18" stop-color="#8FBFAB"/>
      <stop offset="0.55" stop-color="#5E8F7C"/>
      <stop offset="1" stop-color="#3C6456"/>
    </linearGradient>
    <linearGradient id="bodySide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FA08D"/>
      <stop offset="1" stop-color="#2F4E43"/>
    </linearGradient>
    <linearGradient id="hood" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#E7F6EE"/>
      <stop offset="0.35" stop-color="#7EAE99"/>
      <stop offset="1" stop-color="#4C7566"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F4EE"/>
      <stop offset="0.35" stop-color="#C5C9CE"/>
      <stop offset="0.7" stop-color="#8E969E"/>
      <stop offset="1" stop-color="#E7E1D6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5F4F2"/>
      <stop offset="0.25" stop-color="#6E9EA8"/>
      <stop offset="1" stop-color="#1A3338"/>
    </linearGradient>
    <linearGradient id="roof" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset="0.45" stop-color="#F3E0C0"/>
      <stop offset="1" stop-color="#E2C59A"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.38" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#F4EFE6"/>
      <stop offset="1" stop-color="#D9D0C2"/>
    </radialGradient>
    <radialGradient id="pupil" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5A4A3C"/>
      <stop offset="1" stop-color="#1A140F"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FFE38A"/>
      <stop offset="1" stop-color="#E0A020"/>
    </radialGradient>
    <radialGradient id="tail" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFB2A4"/>
      <stop offset="1" stop-color="#B4232C"/>
    </radialGradient>
    <linearGradient id="tire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A433C"/>
      <stop offset="0.35" stop-color="#1A1614"/>
      <stop offset="0.7" stop-color="#2C2723"/>
      <stop offset="1" stop-color="#5C534C"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFF6E4"/>
      <stop offset="0.45" stop-color="#D9C7A4"/>
      <stop offset="1" stop-color="#8C7350"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0B07A"/>
      <stop offset="0.4" stop-color="#A56B42"/>
      <stop offset="1" stop-color="#6A3E2A"/>
    </linearGradient>
    <linearGradient id="boom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A8178"/>
      <stop offset="0.4" stop-color="#3E3834"/>
      <stop offset="1" stop-color="#6B625C"/>
    </linearGradient>
    <radialGradient id="hook" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="0.55" stop-color="#E2B34A"/>
      <stop offset="1" stop-color="#8A6420"/>
    </radialGradient>
    <radialGradient id="rust" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#E59262"/>
      <stop offset="1" stop-color="#8A3E24"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1EEE8"/>
      <stop offset="1" stop-color="#8D939A"/>
    </linearGradient>
  </defs>

  <g transform="translate(320,312) scale(0.58) translate(-320,-108)">
  <!-- ground contact, tight so the route stays readable -->
  <ellipse cx="320" cy="360" rx="150" ry="34" fill="#1A140E" opacity="0.22" filter="url(#soft)"/>

  <!-- rear wheels, closer and larger -->
  <g>
    <rect x="112" y="292" width="86" height="138" rx="32" fill="url(#tire)"/>
    <rect x="124" y="304" width="62" height="114" rx="26" fill="#14110F"/>
    <ellipse cx="155" cy="360" rx="22" ry="30" fill="url(#hub)"/>
    <ellipse cx="148" cy="348" rx="7" ry="9" fill="#FFF8EA" opacity="0.85"/>
    <rect x="442" y="292" width="86" height="138" rx="32" fill="url(#tire)"/>
    <rect x="454" y="304" width="62" height="114" rx="26" fill="#14110F"/>
    <ellipse cx="485" cy="360" rx="22" ry="30" fill="url(#hub)"/>
    <ellipse cx="478" cy="348" rx="7" ry="9" fill="#FFF8EA" opacity="0.8"/>
  </g>
  <!-- front wheels, a little smaller -->
  <g>
    <rect x="128" y="146" width="74" height="112" rx="28" fill="url(#tire)"/>
    <rect x="138" y="156" width="54" height="92" rx="22" fill="#14110F"/>
    <ellipse cx="165" cy="202" rx="18" ry="24" fill="url(#hub)"/>
    <ellipse cx="159" cy="192" rx="6" ry="8" fill="#FFF8EA"/>
    <rect x="438" y="146" width="74" height="112" rx="28" fill="url(#tire)"/>
    <rect x="448" y="156" width="54" height="92" rx="22" fill="#14110F"/>
    <ellipse cx="475" cy="202" rx="18" ry="24" fill="url(#hub)"/>
    <ellipse cx="469" cy="192" rx="6" ry="8" fill="#FFF8EA"/>
  </g>

  <!-- bed thickness -->
  <rect x="214" y="318" width="212" height="168" rx="28" fill="#3A2A22"/>
  <rect x="208" y="308" width="212" height="164" rx="28" fill="url(#wood)"/>
  <!-- planks -->
  <g stroke="#6A3E28" stroke-width="2" opacity="0.55">
    <path d="M228 336 H400" fill="none"/>
    <path d="M224 362 H404" fill="none"/>
    <path d="M222 388 H406" fill="none"/>
    <path d="M226 414 H402" fill="none"/>
    <path d="M232 440 H396" fill="none"/>
  </g>
  <rect x="214" y="314" width="212" height="18" rx="8" fill="#E7C49A" opacity="0.35"/>
  <!-- side rails -->
  <rect x="198" y="324" width="18" height="140" rx="8" fill="url(#rail)"/>
  <rect x="424" y="324" width="18" height="140" rx="8" fill="url(#rail)"/>
  <!-- tail lamps -->
  <ellipse cx="236" cy="456" rx="12" ry="10" fill="url(#tail)"/>
  <ellipse cx="404" cy="456" rx="12" ry="10" fill="url(#tail)"/>
  <ellipse cx="232" cy="452" rx="4" ry="3" fill="#FFE4DC"/>
  <ellipse cx="400" cy="452" rx="4" ry="3" fill="#FFE4DC"/>

  <!-- cab body thickness then lit shell -->
  <path d="M214,168 H426 Q470,168 476,214 V318 Q476,360 430,366 H210 Q164,360 164,318 V214 Q170,168 214,168 Z" fill="#2C4A3E"/>
  <path d="M214,156 H426 Q470,156 476,202 V306 Q476,348 430,354 H210 Q164,348 164,306 V202 Q170,156 214,156 Z" fill="url(#body)"/>
  <!-- left/right shade to round the cab -->
  <path d="M176,210 Q164,250 168,320 Q176,348 196,352 L196,196 Q184,196 176,210 Z" fill="#2F4E43" opacity="0.45"/>
  <path d="M464,210 Q476,250 472,320 Q464,348 444,352 L444,196 Q456,196 464,210 Z" fill="#1E332C" opacity="0.28"/>
  <path d="M230,164 H410 Q446,164 450,196 H190 Q194,164 230,164 Z" fill="#E7F7F0" opacity="0.28"/>

  <!-- hood, in front of the cab -->
  <path d="M236,118 H404 Q438,118 442,146 V176 H198 V146 Q202,118 236,118 Z" fill="#35584C"/>
  <path d="M238,108 H402 Q436,108 440,136 V170 H200 V136 Q204,108 238,108 Z" fill="url(#hood)"/>
  <path d="M250,116 H390 Q410,116 412,132 H228 Q230,116 250,116 Z" fill="#F4FFFB" opacity="0.45"/>
  <!-- panel gap -->
  <path d="M214,162 H426" stroke="#2C4A3E" stroke-width="2" opacity="0.35" fill="none"/>

  <!-- bumper -->
  <rect x="214" y="92" width="212" height="28" rx="12" fill="#5C656C"/>
  <rect x="210" y="84" width="220" height="28" rx="12" fill="url(#chrome)"/>
  <rect x="228" y="92" width="184" height="6" rx="3" fill="#FFFFFF" opacity="0.55"/>
  <!-- bumper rust and a dent -->
  <ellipse cx="236" cy="98" rx="16" ry="8" fill="url(#rust)" opacity="0.9"/>
  <path d="M300,96 Q312,104 324,96" stroke="#6E767C" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- headlights -->
  <g>
    <ellipse cx="250" cy="78" rx="22" ry="20" fill="#8A9096"/>
    <ellipse cx="250" cy="76" rx="18" ry="16" fill="url(#lamp)"/>
    <ellipse cx="244" cy="70" rx="6" ry="4" fill="#FFFFFF"/>
    <ellipse cx="390" cy="78" rx="22" ry="20" fill="#8A9096"/>
    <ellipse cx="390" cy="76" rx="18" ry="16" fill="url(#lamp)"/>
    <ellipse cx="384" cy="70" rx="6" ry="4" fill="#FFFFFF"/>
    <!-- amber winks -->
    <ellipse cx="214" cy="96" rx="8" ry="6" fill="#F0A030"/>
    <ellipse cx="426" cy="96" rx="8" ry="6" fill="#F0A030"/>
  </g>

  <!-- windshield -->
  <path d="M214,168 H426 Q440,168 442,184 V214 Q320,228 198,214 V184 Q200,168 214,168 Z" fill="url(#glass)"/>
  <path d="M230,176 H390 Q400,176 402,188 L250,198 Q236,188 230,176 Z" fill="#FFFFFF" opacity="0.38"/>
  <path d="M250,206 Q320,214 392,206" stroke="#D8F6F4" stroke-width="2" opacity="0.45" fill="none" stroke-linecap="round"/>

  <!-- roof face -->
  <rect x="206" y="214" width="228" height="112" rx="36" fill="#E2C59A"/>
  <rect x="200" y="206" width="228" height="112" rx="36" fill="url(#roof)"/>
  <path d="M230,214 H398 Q420,214 420,232 V250 H208 V232 Q208,214 230,214 Z" fill="#FFF8EC" opacity="0.55"/>

  <!-- eyes, looking forward -->
  <ellipse cx="268" cy="262" rx="28" ry="32" fill="#CDB892"/>
  <ellipse cx="266" cy="258" rx="26" ry="30" fill="url(#eye)"/>
  <ellipse cx="266" cy="250" rx="12" ry="15" fill="url(#pupil)"/>
  <ellipse cx="260" cy="242" rx="5" ry="6" fill="#FFFFFF"/>
  <ellipse cx="372" cy="260" rx="28" ry="32" fill="#CDB892"/>
  <ellipse cx="374" cy="256" rx="26" ry="30" fill="url(#eye)"/>
  <ellipse cx="374" cy="248" rx="12" ry="15" fill="url(#pupil)"/>
  <ellipse cx="368" cy="240" rx="5" ry="6" fill="#FFFFFF"/>
  <!-- brows -->
  <path d="M242,222 Q266,212 292,222" stroke="#C48A62" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M348,220 Q374,210 400,222" stroke="#C48A62" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- cheeks and smile -->
  <ellipse cx="236" cy="286" rx="10" ry="6" fill="#E7A090" opacity="0.55"/>
  <ellipse cx="404" cy="286" rx="10" ry="6" fill="#E7A090" opacity="0.55"/>
  <path d="M286,292 Q320,314 354,292" stroke="#D0675C" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- rear glass -->
  <path d="M230,318 H410 Q424,318 424,332 V348 H216 V332 Q216,318 230,318 Z" fill="url(#glass)"/>
  <path d="M246,324 H360" stroke="#FFFFFF" stroke-width="3" opacity="0.35" stroke-linecap="round"/>

  <!-- mirrors -->
  <g>
    <rect x="146" y="188" width="28" height="14" rx="6" fill="#3E4A46"/>
    <rect x="132" y="176" width="36" height="26" rx="8" fill="url(#chrome)"/>
    <rect x="138" y="181" width="24" height="16" rx="5" fill="url(#glass)"/>
    <rect x="466" y="188" width="28" height="14" rx="6" fill="#3E4A46"/>
    <rect x="472" y="176" width="36" height="26" rx="8" fill="url(#chrome)"/>
    <rect x="478" y="181" width="24" height="16" rx="5" fill="url(#glass)"/>
  </g>

  <!-- rust and worn paint -->
  <ellipse cx="188" cy="176" rx="18" ry="12" fill="url(#rust)"/>
  <ellipse cx="196" cy="184" rx="8" ry="5" fill="#E7C9A4" opacity="0.7"/>
  <ellipse cx="448" cy="250" rx="16" ry="11" fill="url(#rust)" opacity="0.95"/>
  <ellipse cx="250" cy="400" rx="22" ry="12" fill="url(#rust)" opacity="0.85"/>
  <path d="M360,132 l18,8" stroke="#C4B49A" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M300,148 l22,-4" stroke="#3C6456" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <!-- primer chip on the hood -->
  <ellipse cx="340" cy="140" rx="14" ry="8" fill="#D9CDB8"/>
  <ellipse cx="346" cy="142" rx="6" ry="4" fill="#C4623A" opacity="0.7"/>

  <!-- chain and lucky daisy on the bed -->
  <g fill="none" stroke="#D9C7A4" stroke-width="4" stroke-linecap="round">
    <ellipse cx="286" cy="360" rx="8" ry="6"/>
    <ellipse cx="302" cy="366" rx="8" ry="6"/>
    <ellipse cx="318" cy="360" rx="8" ry="6"/>
  </g>
  <g transform="translate(360,400)">
    <ellipse cx="0" cy="-12" rx="5" ry="8" fill="#FFF9F0"/>
    <ellipse cx="0" cy="12" rx="5" ry="8" fill="#FFF9F0"/>
    <ellipse cx="-12" cy="0" rx="8" ry="5" fill="#FFF9F0"/>
    <ellipse cx="12" cy="0" rx="8" ry="5" fill="#FFF9F0"/>
    <circle cx="0" cy="0" r="5" fill="#F0C14A"/>
  </g>

  <!-- boom and hook -->
  <rect x="292" y="430" width="56" height="22" rx="8" fill="#2A2420"/>
  <rect x="300" y="448" width="40" height="78" rx="10" fill="url(#boom)"/>
  <rect x="306" y="456" width="10" height="62" rx="4" fill="#FFFFFF" opacity="0.18"/>
  <rect x="286" y="512" width="68" height="16" rx="6" fill="#4A433C"/>
  <circle cx="320" cy="548" r="26" fill="#5A4630"/>
  <circle cx="320" cy="544" r="24" fill="url(#hook)"/>
  <circle cx="320" cy="544" r="12" fill="none" stroke="#6A4E1C" stroke-width="7"/>
  <ellipse cx="312" cy="534" rx="6" ry="4" fill="#FFF6D4" opacity="0.9"/>
  <!-- hook tongue -->
  <path d="M320,566 q18,18 8,28" stroke="#8A6420" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
