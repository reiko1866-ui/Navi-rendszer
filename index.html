<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rajzfilmes 3D Navigáció</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; background: #070a0f; font-family: 'Comic Neue', cursive, sans-serif;
            user-select: none; -webkit-user-select: none;
        }

        #gameCanvas {
            display: block; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 1;
        }

        /* Felső navigációs sáv */
        #top-bar {
            position: fixed; top: 15px; left: 15px; right: 15px;
            z-index: 10; display: flex; gap: 10px; align-items: center; pointer-events: none;
        }
        #instruction-box {
            flex: 1; background: #2ecc71; border: 3px solid #111;
            border-radius: 16px; padding: 10px 16px; display: flex; align-items: center; gap: 14px;
            box-shadow: 0 4px 0px #111; font-size: 20px; font-weight: bold; color: #fff;
            pointer-events: auto;
        }
        .icon-btn {
            background: #2ecc71; border: 3px solid #111; border-radius: 16px;
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; box-shadow: 0 4px 0px #111; cursor: pointer; color: #fff;
            pointer-events: auto;
        }

        /* Alsó műszerfal elemek */
        #limit-gauge {
            position: fixed; bottom: 20px; left: 20px; z-index: 10;
            width: 70px; height: 70px; background: #ff334b; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 0px #111; color: #fff; font-size: 26px; font-weight: bold;
            border: 3px solid #111;
        }

        #speed-gauge {
            position: fixed; bottom: 20px; right: 20px; z-index: 10;
            width: 70px; height: 70px; background: #ffffff; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 5px 0px #111; color: #222; border: 3px solid #111;
        }
        .speed-val { font-size: 24px; font-weight: bold; line-height: 1; color: #ff334b; }
        .speed-unit { font-size: 9px; font-weight: bold; color: #666; margin-top: 2px; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div id="instruction-box">
            <span style="font-size: 24px;">⬅️</span>
            <div>
                <div style="font-size: 20px;" id="distance-text">250 m</div>
                <div style="font-size: 12px; font-weight: normal; opacity: 0.9;" id="street-text">Fő út / Váci út</div>
            </div>
        </div>
        <div class="icon-btn">🔍</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="limit-gauge">50</div>
    <div id="speed-gauge">
        <span class="speed-val" id="speed-val">0</span>
        <span class="speed-unit">KM/H</span>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let currentSpeed = 0;
        let roadOffset = 0;
        let isNight = true; // Alapból éjszakai mód a videó alapján

        // Óra alapú automatikus váltás
        function updateTheme() {
            const hour = new Date().getHours();
            isNight = (hour < 6 || hour >= 18);
        }
        updateTheme();

        // GPS sebesség lekérdezés
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                if (position.coords.speed !== null) {
                    currentSpeed = Math.round(position.coords.speed * 3.6);
                } else {
                    currentSpeed = 3; // teszt alapmozgás
                }
                document.getElementById('speed-val').innerText = currentSpeed;
            }, () => {
                currentSpeed = 3;
            }, { enableHighAccuracy: true });
        }

        function render() {
            const width = canvas.width;
            const height = canvas.height;

            // 1. ÉGBOLT
            if (isNight) {
                const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.4);
                skyGrad.addColorStop(0, '#070a0f');
                skyGrad.addColorStop(1, '#131b26');
                ctx.fillStyle = skyGrad;
            } else {
                const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.4);
                skyGrad.addColorStop(0, '#81d4fa');
                skyGrad.addColorStop(1, '#e1f5fe');
                ctx.fillStyle = skyGrad;
            }
            ctx.fillRect(0, 0, width, height * 0.4);

            // 2. FÖLD / FÜVES TERÜLET
            ctx.fillStyle = isNight ? '#0c1410' : '#81c784';
            ctx.fillRect(0, height * 0.4, width, height * 0.6);

            // 3. ÚT ÉS PERSPEKTÍVA
            const horizonY = height * 0.4;
            const roadWidthBottom = width * 0.75;
            const roadWidthTop = width * 0.06;

            roadOffset += (currentSpeed + 2) * 0.035;
            const curve = Math.sin(roadOffset * 0.03) * (width * 0.22);

            ctx.beginPath();
            ctx.moveTo((width - roadWidthBottom) / 2, height);
            ctx.bezierCurveTo(
                width / 2 + curve * 0.3, horizonY + (height - horizonY) * 0.5,
                width / 2 + curve, horizonY + (height - horizonY) * 0.15,
                (width - roadWidthTop) / 2 + curve * 0.05, horizonY
            );
            ctx.lineTo((width + roadWidthTop) / 2 + curve * 0.05, horizonY);
            ctx.bezierCurveTo(
                width / 2 + curve, horizonY + (height - horizonY) * 0.15,
                width / 2 + curve * 0.3, horizonY + (height - horizonY) * 0.5,
                (width + roadWidthBottom) / 2, height
            );
            ctx.closePath();

            // Aszfalt háttér
            ctx.fillStyle = isNight ? '#1a1e24' : '#37474f';
            ctx.fill();

            // Középső világító sáv (neon kék éjjel, zöld nappal)
            ctx.beginPath();
            const centerTopX = width / 2 + curve * 0.05;
            const centerBottomX = width / 2;
            ctx.moveTo(centerBottomX - 8, height);
            ctx.lineTo(centerTopX - 2, horizonY);
            ctx.lineTo(centerTopX + 2, horizonY);
            ctx.lineTo(centerBottomX + 8, height);
            ctx.closePath();
            ctx.fillStyle = isNight ? '#00e5ff' : '#2ecc71';
            if (isNight) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00e5ff';
            }
            ctx.fill();
            ctx.shadowBlur = 0;

            // Szaggatott fehér vonalak
            ctx.fillStyle = '#ffffff';
            const dashCount = 14;
            for (let i = 0; i < dashCount; i++) {
                let p = (i / dashCount + (roadOffset * 0.025) % 1) % 1;
                let py = horizonY + p * (height - horizonY);
                let pw = Math.max(2, p * 6);
                let px = width / 2 + curve * 0.05 * p;
                ctx.fillRect(px - pw * 0.5, py, pw, p * 20);
            }

            // 4. ÚTSZÉLI LÁMPÁK VAGY FÁK
            const itemCount = 10;
            for (let i = 0; i < itemCount; i++) {
                let progress = (i / itemCount + (roadOffset * 0.007) % 1) % 1;
                let y = horizonY + progress * (height - horizonY);
                let xFactor = (width * 0.38) * (1 - progress);

                if (isNight) {
                    // Útszéli sárga lámpák
                    drawLamp(width / 2 - roadWidthBottom * 0.5 - xFactor - 20, y, progress);
                    drawLamp(width / 2 + roadWidthBottom * 0.5 + xFactor + 20, y, progress);
                }
            }

            // 5. PIROS AUTÓ HÁTULNÉZETBŐL (tökéletes pozícióban)
            drawPlayerCar(width / 2, height - 55);

            requestAnimationFrame(render);
        }

        function drawLamp(x, y, scale) {
            let size = Math.max(3, scale * 22);
            ctx.fillStyle = '#111';
            ctx.fillRect(x - 2, y - size * 1.8, 3, size * 1.8);

            ctx.beginPath();
            ctx.arc(x, y - size * 1.8, Math.max(2.5, size * 0.25), 0, Math.PI * 2);
            ctx.fillStyle = '#ffeb3b';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffeb3b';
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawPlayerCar(cx, cy) {
            ctx.save();
            ctx.translate(cx, cy);

            // Kerekek
            ctx.fillStyle = '#111';
            ctx.fillRect(-85, 5, 22, 35);
            ctx.fillRect(63, 5, 22, 35);

            // Piros kasztni
            ctx.fillStyle = '#ff334b';
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 3;
            
            ctx.beginPath();
            ctx.roundRect(-75, -15, 150, 65, 14);
            ctx.fill();
            ctx.stroke();

            // Tető / Hátsó szélvédő
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.roundRect(-55, -35, 110, 32, 10);
            ctx.fill();

            ctx.restore();
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
