<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ToonNav3D</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #08101c;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }
        #world {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        .card {
            position: fixed;
            z-index: 2;
            background: rgba(12, 24, 48, 0.82);
            border: 2px solid rgba(255, 255, 255, 0.22);
            border-radius: 18px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
            padding: 10px 14px;
        }
        #maneuver {
            top: calc(12px + env(safe-area-inset-top));
            left: calc(12px + env(safe-area-inset-left));
            display: flex;
            gap: 10px;
            align-items: center;
            min-width: 180px;
        }
        .arrow {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }
        .big { font-size: 20px; font-weight: 700; line-height: 1.1; }
        .small { font-size: 13px; color: #d5deea; margin-top: 2px; }
        #weather {
            top: calc(12px + env(safe-area-inset-top));
            right: calc(12px + env(safe-area-inset-right));
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #weather .icon { font-size: 28px; }
        #speed-wrap {
            position: fixed;
            z-index: 2;
            top: calc(92px + env(safe-area-inset-top));
            right: calc(18px + env(safe-area-inset-right));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        #limit {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #e10600;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        #speed {
            background: rgba(12, 24, 48, 0.82);
            border-radius: 12px;
            padding: 4px 8px;
            font-weight: 700;
            font-size: 14px;
        }
        #trip {
            left: calc(12px + env(safe-area-inset-left));
            bottom: calc(14px + env(safe-area-inset-bottom));
            min-width: 168px;
        }
        #radar {
            position: fixed;
            z-index: 2;
            right: calc(14px + env(safe-area-inset-right));
            bottom: calc(14px + env(safe-area-inset-bottom));
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 4px solid white;
            background: rgba(16, 32, 28, 0.9);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #radar .arrow {
            width: auto;
            height: auto;
            background: none;
            font-size: 34px;
            color: #2f6bff;
            text-shadow: 0 0 6px white;
        }
        #sign {
            position: fixed;
            z-index: 2;
            top: 46%;
            left: 62%;
            background: #1e8f3e;
            border: 3px solid #f4f4f4;
            border-radius: 4px;
            padding: 4px 10px;
            font-weight: 800;
            letter-spacing: 0.3px;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
        }
        #status {
            position: fixed;
            z-index: 3;
            left: 50%;
            bottom: calc(10px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            background: rgba(8, 16, 32, 0.72);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            max-width: calc(100% - 200px);
            text-align: center;
        }
        #peek {
            pointer-events: auto;
            border: 0;
            border-radius: 999px;
            background: white;
            color: #102038;
            font-weight: 700;
            padding: 4px 8px;
            font-family: inherit;
        }
        @media (max-width: 720px) {
            .big { font-size: 16px; }
            #sign { left: 50%; top: 42%; }
            #status { max-width: calc(100% - 24px); bottom: calc(78px + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>
    <canvas id="world"></canvas>

    <section id="maneuver" class="card">
        <div class="arrow">↱</div>
        <div>
            <div class="big">2,3 km</div>
            <div class="small">Következő utca</div>
        </div>
    </section>

    <section id="weather" class="card">
        <div class="icon" id="weather-icon">☀️</div>
        <div>
            <div class="big" id="temp">22°C</div>
            <div class="small" id="weather-text">Enyhe szél</div>
        </div>
    </section>

    <div id="speed-wrap">
        <div id="limit">50</div>
        <div id="speed">46 km/h</div>
    </div>

    <div id="sign">Belváros</div>

    <section id="trip" class="card">
        <div class="big">🏁 <span id="distance">12 km</span></div>
        <div class="small"><span id="minutes">22 perc</span> · <span id="arrival">--:--</span></div>
    </section>

    <div id="radar" aria-hidden="true"><div class="arrow">➤</div></div>

    <div id="status">
        <span id="status-text">Az óra állítja a nappalt és az éjszakát.</span>
        <button id="peek" type="button">Éjszaka</button>
    </div>

    <script>
        var canvas = document.getElementById("world");
        var ctx = canvas.getContext("2d");
        var roadOffset = 0;
        var preview = null;
        var previewUntil = 0;

        function resize() {
            var ratio = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(window.innerWidth * ratio);
            canvas.height = Math.floor(window.innerHeight * ratio);
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        }

        function minutesOf(date) {
            return date.getHours() * 60 + date.getMinutes() + date.getSeconds() / 60;
        }

        // 1 = full day, 0 = full night. The fade lasts one hour.
        function daylightFromDate(date) {
            var minutes = minutesOf(date);
            var sunrise = 6 * 60;
            var day = 7 * 60;
            var sunset = 19 * 60;
            var night = 20 * 60;
            if (minutes >= day && minutes < sunset) return 1;
            if (minutes >= night || minutes < sunrise) return 0;
            if (minutes >= sunrise && minutes < day) return (minutes - sunrise) / 60;
            return 1 - (minutes - sunset) / 60;
        }

        function shownDate() {
            var params = new URLSearchParams(window.location.search);
            if (!params.has("hour")) return new Date();
            var forced = new Date();
            var hour = Number(params.get("hour"));
            if (hour >= 0 && hour <= 23) forced.setHours(hour, 0, 0, 0);
            return forced;
        }

        function daylightNow() {
            if (preview !== null && Date.now() < previewUntil) return preview;
            preview = null;
            return daylightFromDate(shownDate());
        }

        function mix(a, b, t) {
            return a + (b - a) * t;
        }

        function mixColor(day, night, t) {
            return [
                mix(night[0], day[0], t),
                mix(night[1], day[1], t),
                mix(night[2], day[2], t)
            ];
        }

        function paint(color) {
            return "rgb(" + (color[0] | 0) + "," + (color[1] | 0) + "," + (color[2] | 0) + ")";
        }

        function clock(date) {
            var h = date.getHours();
            var m = date.getMinutes();
            return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
        }

        function updateHud(date, daylight) {
            var icon = document.getElementById("weather-icon");
            var temp = document.getElementById("temp");
            var text = document.getElementById("weather-text");
            var peek = document.getElementById("peek");
            var status = document.getElementById("status-text");
            var arrival = new Date(date.getTime() + 22 * 60 * 1000);

            document.getElementById("arrival").textContent = clock(arrival);
            document.getElementById("speed").textContent = "46 km/h";

            if (daylight > 0.72) {
                icon.textContent = "☀️";
                temp.textContent = "22°C";
                text.textContent = "Enyhe szél";
            } else if (daylight < 0.28) {
                icon.textContent = "🌙";
                temp.textContent = "12°C";
                text.textContent = "Tiszta égbolt";
            } else if (date.getHours() < 12) {
                icon.textContent = "🌅";
                temp.textContent = "16°C";
                text.textContent = "Napkelte";
            } else {
                icon.textContent = "🌇";
                temp.textContent = "18°C";
                text.textContent = "Naplemente";
            }

            if (preview !== null && Date.now() < previewUntil) {
                status.textContent = "Előnézet";
                peek.textContent = "Óra";
            } else {
                var mode = daylight > 0.5 ? "Nappal" : "Éjszaka";
                status.textContent = mode + " · " + clock(date);
                peek.textContent = daylight > 0.5 ? "Éjszaka" : "Nappal";
            }
        }

        function roundedRect(x, y, w, h, r) {
            var radius = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
            ctx.closePath();
        }

        function drawSky(w, h, horizon, daylight, date) {
            var top = mixColor([94, 186, 255], [7, 10, 34], daylight);
            var bottom = mixColor([255, 214, 150], [28, 42, 92], daylight);
            var sky = ctx.createLinearGradient(0, 0, 0, horizon);
            sky.addColorStop(0, paint(top));
            sky.addColorStop(1, paint(bottom));
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, w, horizon + 2);

            if (daylight < 0.8) {
                ctx.fillStyle = "rgba(255,255,255," + (0.85 * (1 - daylight)) + ")";
                for (var i = 0; i < 28; i++) {
                    var sx = (i * 97) % w;
                    var sy = (i * 53) % (horizon * 0.7);
                    ctx.fillRect(sx, sy, 2, 2);
                }
            }

            var minutes = minutesOf(date);
            var across = (minutes - 6 * 60) / (14 * 60);
            across = Math.max(0, Math.min(1, across));
            var arc = Math.sin(across * Math.PI);
            var bodyX = w * (0.3 + across * 0.4);
            var bodyY = horizon - 30 - arc * horizon * 0.62;

            if (daylight > 0.08) {
                ctx.fillStyle = "rgba(255, 214, 80, " + daylight + ")";
                ctx.beginPath();
                ctx.arc(bodyX, bodyY, 28, 0, Math.PI * 2);
                ctx.fill();
            }
            if (daylight < 0.92) {
                var moonX = w * 0.38;
                var moonY = Math.max(78, horizon * 0.22);
                ctx.fillStyle = "rgba(245, 236, 196, " + (1 - daylight) + ")";
                ctx.beginPath();
                ctx.arc(moonX, moonY, 18, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawCity(w, horizon, daylight) {
            var riverTop = horizon - 8;
            ctx.fillStyle = paint(mixColor([72, 170, 220], [18, 36, 78], daylight));
            ctx.fillRect(0, riverTop, w, 36);

            if (daylight > 0.4) {
                ctx.fillStyle = "rgba(255,255,255,0.85)";
                ctx.beginPath();
                ctx.moveTo(w * 0.16, riverTop + 20);
                ctx.lineTo(w * 0.16, riverTop + 8);
                ctx.lineTo(w * 0.2, riverTop + 14);
                ctx.fill();
            }

            var buildings = [
                [0.08, 70, 46, [244, 196, 120]],
                [0.18, 110, 54, [232, 122, 104]],
                [0.31, 150, 90, [186, 214, 232]],
                [0.46, 96, 60, [244, 176, 92]],
                [0.58, 78, 48, [120, 186, 168]],
                [0.7, 120, 64, [214, 228, 236]],
                [0.82, 88, 50, [240, 140, 126]]
            ];

            for (var i = 0; i < buildings.length; i++) {
                var item = buildings[i];
                var x = w * item[0];
                var bh = item[1];
                var bw = item[2];
                var color = mixColor(item[3], [item[3][0] * 0.28, item[3][1] * 0.32, item[3][2] * 0.45], daylight);
                ctx.fillStyle = paint(color);
                ctx.fillRect(x, horizon - bh, bw, bh);
                if (daylight < 0.75) {
                    ctx.fillStyle = "rgba(255, 214, 120, " + (1 - daylight) + ")";
                    for (var wy = horizon - bh + 12; wy < horizon - 16; wy += 16) {
                        for (var wx = x + 8; wx < x + bw - 8; wx += 14) {
                            ctx.fillRect(wx, wy, 6, 8);
                        }
                    }
                }
            }

            ctx.strokeStyle = paint(mixColor([70, 78, 88], [20, 24, 32], daylight));
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(w * 0.2, horizon - 8);
            ctx.lineTo(w * 0.2, horizon - 52);
            ctx.moveTo(w * 0.34, horizon - 8);
            ctx.lineTo(w * 0.34, horizon - 52);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(w * 0.2, horizon - 48);
            ctx.quadraticCurveTo(w * 0.27, horizon - 70, w * 0.34, horizon - 48);
            ctx.stroke();

            ctx.fillStyle = paint(mixColor([186, 214, 150], [24, 48, 36], daylight));
            for (var t = 0; t < 8; t++) {
                var tx = (t / 8) * w;
                ctx.beginPath();
                ctx.arc(tx, horizon - 16, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(tx - 2, horizon - 16, 4, 18);
            }
        }

        function roadEdge(w, h, horizon, progress, side, curve) {
            var center = w * 0.52 + curve * (1 - progress);
            var half = mix(w * 0.035, w * 0.46, Math.pow(progress, 1.15));
            var y = mix(horizon, h, progress);
            return { x: center + side * half, y: y };
        }

        function drawRoad(w, h, horizon, daylight) {
            var curve = Math.sin(roadOffset * 0.015) * w * 0.12;
            ctx.beginPath();
            var nearLeft = roadEdge(w, h, horizon, 1, -1, curve);
            var farLeft = roadEdge(w, h, horizon, 0.02, -1, curve);
            var farRight = roadEdge(w, h, horizon, 0.02, 1, curve);
            var nearRight = roadEdge(w, h, horizon, 1, 1, curve);
            ctx.moveTo(nearLeft.x, nearLeft.y);
            ctx.lineTo(farLeft.x, farLeft.y);
            ctx.lineTo(farRight.x, farRight.y);
            ctx.lineTo(nearRight.x, nearRight.y);
            ctx.closePath();
            ctx.fillStyle = paint(mixColor([86, 92, 102], [28, 32, 40], daylight));
            ctx.fill();

            ctx.strokeStyle = "rgba(255,255,255,0.85)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(roadEdge(w, h, horizon, 1, -0.92, curve).x, nearLeft.y);
            ctx.lineTo(roadEdge(w, h, horizon, 0.02, -0.92, curve).x, farLeft.y);
            ctx.moveTo(roadEdge(w, h, horizon, 1, 0.92, curve).x, nearRight.y);
            ctx.lineTo(roadEdge(w, h, horizon, 0.02, 0.92, curve).x, farRight.y);
            ctx.stroke();

            ctx.fillStyle = "rgba(0, 210, 255, 0.95)";
            ctx.shadowColor = "#00e5ff";
            ctx.shadowBlur = 16 * (0.45 + daylight * 0.55);
            for (var i = 0; i < 8; i++) {
                var progress = ((i / 8) + (roadOffset * 0.004) % 1) % 1;
                if (progress < 0.08) continue;
                var a = roadEdge(w, h, horizon, progress, -0.035, curve);
                var b = roadEdge(w, h, horizon, Math.min(1, progress + 0.08), -0.06, curve);
                var c = roadEdge(w, h, horizon, Math.min(1, progress + 0.08), 0.06, curve);
                var d = roadEdge(w, h, horizon, progress, 0.035, curve);
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.lineTo(c.x, c.y);
                ctx.lineTo(d.x, d.y);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            if (daylight < 0.7) {
                for (var lamp = 0; lamp < 6; lamp++) {
                    var lp = ((lamp / 6) + (roadOffset * 0.003) % 1) % 1;
                    if (lp < 0.12) continue;
                    var left = roadEdge(w, h, horizon, lp, -1.15, curve);
                    var glow = (1 - daylight) * (0.3 + lp);
                    ctx.fillStyle = "rgba(255, 220, 120, " + glow + ")";
                    ctx.beginPath();
                    ctx.arc(left.x, left.y - 18 * lp, 4 + lp * 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function drawCar(w, h) {
            var x = w * 0.5;
            var bottomSpace = w < h ? 230 : 120;
            var y = h - bottomSpace;
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = "rgba(0,0,0,0.25)";
            roundedRect(-58, 18, 116, 18, 8);
            ctx.fill();
            ctx.fillStyle = "#1d2430";
            roundedRect(-62, 4, 22, 28, 6);
            roundedRect(40, 4, 22, 28, 6);
            ctx.fill();
            ctx.fillStyle = "#2f86ea";
            roundedRect(-54, -16, 108, 48, 14);
            ctx.fill();
            ctx.fillStyle = "#d7f1ff";
            roundedRect(-34, -30, 68, 24, 8);
            ctx.fill();
            ctx.fillStyle = "#ff4b55";
            ctx.fillRect(-48, 8, 12, 6);
            ctx.fillRect(36, 8, 12, 6);
            ctx.restore();
        }

        function frame() {
            var date = shownDate();
            var daylight = daylightNow();
            var w = window.innerWidth;
            var h = window.innerHeight;
            var horizon = h * 0.46;
            roadOffset += 1.4;

            ctx.clearRect(0, 0, w, h);
            drawSky(w, h, horizon, daylight, date);
            var bank = mixColor([126, 196, 92], [16, 36, 28], daylight);
            ctx.fillStyle = paint(bank);
            ctx.fillRect(0, horizon - 8, w, h);
            drawCity(w, horizon, daylight);
            drawRoad(w, h, horizon + 8, daylight);
            drawCar(w, h);
            updateHud(date, daylight);
            requestAnimationFrame(frame);
        }

        document.getElementById("peek").addEventListener("click", function () {
            if (preview !== null && Date.now() < previewUntil) {
                preview = null;
                return;
            }
            var current = daylightFromDate(shownDate());
            preview = current > 0.5 ? 0 : 1;
            previewUntil = Date.now() + 12000;
        });

        window.addEventListener("resize", resize);
        resize();
        requestAnimationFrame(frame);
    </script>
</body>
</html>
