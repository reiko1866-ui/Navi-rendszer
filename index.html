<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ToonNav3D</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #8fd0f8;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }
        #world {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        .card {
            position: fixed;
            z-index: 2;
            background: rgba(16, 32, 64, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.22);
            padding: 10px 14px;
        }
        #maneuver {
            top: calc(10px + env(safe-area-inset-top));
            left: calc(10px + env(safe-area-inset-left));
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .arrow-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .big { font-size: 20px; font-weight: 800; line-height: 1.05; }
        .small { font-size: 13px; color: #d7e2ef; margin-top: 2px; }
        #weather {
            top: calc(10px + env(safe-area-inset-top));
            right: calc(10px + env(safe-area-inset-right));
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #weather .icon { font-size: 30px; line-height: 1; }
        #dock {
            position: fixed;
            z-index: 2;
            top: calc(86px + env(safe-area-inset-top));
            right: calc(14px + env(safe-area-inset-right));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        #limit {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: #e10600;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.28);
        }
        #speed {
            font-weight: 800;
            font-size: 15px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.65);
        }
        .round {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(16, 32, 64, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        #trip {
            left: calc(10px + env(safe-area-inset-left));
            bottom: calc(12px + env(safe-area-inset-bottom));
        }
        #radar {
            position: fixed;
            z-index: 2;
            right: calc(12px + env(safe-area-inset-right));
            bottom: calc(12px + env(safe-area-inset-bottom));
            width: 78px;
            height: 78px;
            border-radius: 50%;
            border: 4px solid white;
            background: #1d6b45;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.28);
            overflow: hidden;
        }
        #status {
            position: fixed;
            z-index: 3;
            left: 50%;
            bottom: calc(78px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            background: rgba(8, 16, 32, 0.78);
            border-radius: 999px;
            padding: 5px 8px 5px 12px;
            font-size: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #peek, #rain, #snow {
            border: 0;
            border-radius: 999px;
            background: white;
            color: #102038;
            font-weight: 800;
            padding: 4px 8px;
            font-family: inherit;
        }
        @media (max-height: 520px) {
            .round { width: 34px; height: 34px; }
            #limit { width: 52px; height: 52px; font-size: 22px; }
            #radar { width: 64px; height: 64px; }
            #dock { top: calc(74px + env(safe-area-inset-top)); gap: 6px; }
            #status { bottom: calc(10px + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>
    <canvas id="world"></canvas>

    <section id="maneuver" class="card">
        <div class="arrow-box">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 16 V9 H15"></path>
                <path d="M11 5 L16 9 L11 13"></path>
            </svg>
        </div>
        <div>
            <div class="big">2,3 km</div>
            <div class="small">Következő utca</div>
        </div>
    </section>

    <section id="weather" class="card">
        <div class="icon" id="weather-icon">☀️</div>
        <div>
            <div class="big" id="temp">22°C</div>
            <div class="small" id="weather-text">Enyhe szél</div>
        </div>
    </section>

    <div id="dock">
        <div id="limit">50</div>
        <div id="speed">46 km/h</div>
        <div class="round">🔊</div>
        <div class="round">➤</div>
        <div class="round">⚙</div>
    </div>

    <section id="trip" class="card">
        <div class="big">🏁 <span id="distance">12 km</span></div>
        <div class="small"><span id="minutes">22 perc</span> · <span id="arrival">--:--</span></div>
    </section>

    <div id="radar" aria-hidden="true">
        <svg viewBox="0 0 80 80" width="78" height="78">
            <circle cx="40" cy="40" r="40" fill="#1d6b45"></circle>
            <path d="M8 58 C 24 50, 30 28, 46 24 C 58 21, 66 34, 74 18" fill="none" stroke="#b7e4c7" stroke-width="7" stroke-linecap="round"></path>
            <polygon points="40,18 49,42 40,36 31,42" fill="#2f6bff" stroke="white" stroke-width="2"></polygon>
            <text x="40" y="14" text-anchor="middle" fill="white" font-size="9" font-family="Trebuchet MS, sans-serif">N</text>
        </svg>
    </div>

    <div id="status">
        <span id="status-text">Nappal</span>
        <button id="peek" type="button">Éjszaka</button>
        <button id="rain" type="button">Eső</button>
        <button id="snow" type="button">Hó</button>
    </div>

    <script>
        var canvas = document.getElementById("world");
        var ctx = canvas.getContext("2d");
        var roadOffset = 0;
        var previewMode = null;
        var previewUntil = 0;
        var viewW = 1;
        var viewH = 1;
        var horizon = 1;
        var sceneRain = false;
        var sceneSnow = false;

        function resize() {
            var ratio = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(window.innerWidth * ratio);
            canvas.height = Math.floor(window.innerHeight * ratio);
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            viewW = window.innerWidth;
            viewH = window.innerHeight;
        }

        function minutesOf(date) {
            return date.getHours() * 60 + date.getMinutes() + date.getSeconds() / 60;
        }

        function daylightFromDate(date) {
            var minutes = minutesOf(date);
            var sunrise = 6 * 60;
            var day = 7 * 60;
            var sunset = 19 * 60;
            var night = 20 * 60;
            if (minutes >= day && minutes < sunset) return 1;
            if (minutes >= night || minutes < sunrise) return 0;
            if (minutes >= sunrise && minutes < day) return (minutes - sunrise) / 60;
            return 1 - (minutes - sunset) / 60;
        }

        function shownDate() {
            var match = window.location.href.match(/hour=(\d{1,2})/);
            if (!match) return new Date();
            var forced = new Date();
            var hour = Number(match[1]);
            if (hour >= 0 && hour <= 23) forced.setHours(hour, 0, 0, 0);
            return forced;
        }

        function pageWants(name) {
            return window.location.href.indexOf("weather=" + name) !== -1;
        }

        function sceneNow() {
            if (pageWants("rain")) return { daylight: 0.45, rain: true, snow: false };
            if (pageWants("snow")) return { daylight: 0.72, rain: false, snow: true };
            if (previewMode !== null && Date.now() < previewUntil) {
                if (previewMode === "rain") return { daylight: 0.45, rain: true, snow: false };
                if (previewMode === "snow") return { daylight: 0.72, rain: false, snow: true };
                return { daylight: previewMode === "night" ? 0 : 1, rain: false, snow: false };
            }
            previewMode = null;
            return { daylight: daylightFromDate(shownDate()), rain: false, snow: false };
        }

        function mix(a, b, t) {
            return a + (b - a) * t;
        }

        function mixColor(day, night, t) {
            return [
                mix(night[0], day[0], t),
                mix(night[1], day[1], t),
                mix(night[2], day[2], t)
            ];
        }

        function paint(color) {
            return "rgb(" + (color[0] | 0) + "," + (color[1] | 0) + "," + (color[2] | 0) + ")";
        }

        function clock(date) {
            var h = date.getHours();
            var m = date.getMinutes();
            return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
        }

        function updateHud(date, daylight, rain, snow) {
            var icon = document.getElementById("weather-icon");
            var temp = document.getElementById("temp");
            var text = document.getElementById("weather-text");
            var peek = document.getElementById("peek");
            var rainButton = document.getElementById("rain");
            var snowButton = document.getElementById("snow");
            var status = document.getElementById("status-text");
            var arrival = new Date(date.getTime() + 22 * 60 * 1000);
            document.getElementById("arrival").textContent = clock(arrival);
            var showingRain = rain && (previewMode === "rain" || pageWants("rain"));
            var showingSnow = snow && (previewMode === "snow" || pageWants("snow"));

            if (showingSnow) {
                icon.textContent = "❄️";
                temp.textContent = "-2°C";
                text.textContent = "Havazás";
                status.textContent = "Havazás";
                peek.textContent = daylightFromDate(date) > 0.5 ? "Éjszaka" : "Nappal";
                rainButton.textContent = "Eső";
                snowButton.textContent = "Óra";
                return;
            }

            if (showingRain) {
                icon.textContent = "🌧️";
                temp.textContent = "16°C";
                text.textContent = "Eső";
                status.textContent = "Eső";
                peek.textContent = daylightFromDate(date) > 0.5 ? "Éjszaka" : "Nappal";
                rainButton.textContent = "Óra";
                snowButton.textContent = "Hó";
                return;
            }

            if (daylight > 0.72) {
                icon.textContent = "☀️";
                temp.textContent = "22°C";
                text.textContent = "Enyhe szél";
            } else if (daylight < 0.28) {
                icon.textContent = "🌙";
                temp.textContent = "12°C";
                text.textContent = "Tiszta égbolt";
            } else if (date.getHours() < 12) {
                icon.textContent = "🌅";
                temp.textContent = "16°C";
                text.textContent = "Napkelte";
            } else {
                icon.textContent = "🌇";
                temp.textContent = "18°C";
                text.textContent = "Naplemente";
            }

            rainButton.textContent = "Eső";
            snowButton.textContent = "Hó";
            if (previewMode !== null && Date.now() < previewUntil) {
                status.textContent = "Előnézet";
                peek.textContent = "Óra";
            } else {
                status.textContent = (daylight > 0.5 ? "Nappal" : "Éjszaka") + " · " + clock(date);
                peek.textContent = daylight > 0.5 ? "Éjszaka" : "Nappal";
            }
        }

        function roundedRect(x, y, w, h, r) {
            var radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
            ctx.closePath();
        }

        function roadPoint(t, side) {
            var curve = Math.sin(roadOffset * 0.01) * viewW * 0.05 * (1 - t);
            var y = horizon + (viewH - horizon) * Math.pow(t, 0.9);
            var half = mix(viewW * 0.018, viewW * 0.3, Math.pow(t, 1.08));
            var center = viewW * 0.5 + curve;
            return { x: center + side * half, y: y, scale: 0.2 + t * 0.8, center: center };
        }

        function drawCloud(x, y, s, daylight) {
            ctx.fillStyle = "rgba(255,255,255," + (0.9 * daylight) + ")";
            ctx.beginPath();
            ctx.ellipse(x, y, s, s * 0.48, 0, 0, Math.PI * 2);
            ctx.ellipse(x + s * 0.7, y + s * 0.08, s * 0.62, s * 0.36, 0, 0, Math.PI * 2);
            ctx.ellipse(x - s * 0.62, y + s * 0.1, s * 0.55, s * 0.32, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawHouse(x, base, bw, bh, wall, roof, daylight) {
            if (bw < 4 || bh < 6) return;
            var body = mixColor(wall, [wall[0] * 0.22, wall[1] * 0.24, wall[2] * 0.38], daylight);
            var shade = mixColor([wall[0] * 0.72, wall[1] * 0.68, wall[2] * 0.64], [wall[0] * 0.12, wall[1] * 0.14, wall[2] * 0.26], daylight);
            ctx.fillStyle = paint(body);
            ctx.fillRect(x, base - bh, bw, bh);
            ctx.fillStyle = paint(shade);
            ctx.fillRect(x + bw * 0.78, base - bh, bw * 0.22, bh);
            ctx.fillStyle = paint(mixColor([255, 236, 214], [48, 40, 52], daylight));
            ctx.fillRect(x - bw * 0.03, base - bh, bw * 1.06, Math.max(2, bh * 0.04));

            ctx.fillStyle = paint(mixColor(roof, [roof[0] * 0.25, roof[1] * 0.22, roof[2] * 0.28], daylight));
            ctx.beginPath();
            ctx.moveTo(x - bw * 0.08, base - bh);
            ctx.lineTo(x + bw * 0.5, base - bh - bw * 0.5);
            ctx.lineTo(x + bw * 1.08, base - bh);
            ctx.fill();
            if (sceneSnow) {
                ctx.fillStyle = "rgba(255,255,255,0.94)";
                ctx.beginPath();
                ctx.moveTo(x - bw * 0.1, base - bh + 1);
                ctx.lineTo(x + bw * 0.5, base - bh - bw * 0.52);
                ctx.lineTo(x + bw * 1.1, base - bh + 1);
                ctx.fill();
            }

            ctx.fillStyle = paint(mixColor([122, 78, 58], [32, 24, 28], daylight));
            ctx.fillRect(x + bw * 0.66, base - bh - bw * 0.36, Math.max(2, bw * 0.12), bw * 0.3);
            if (sceneSnow) {
                ctx.fillStyle = "rgba(255,255,255,0.95)";
                ctx.fillRect(x + bw * 0.62, base - bh - bw * 0.42, Math.max(3, bw * 0.2), Math.max(2, bw * 0.08));
            }

            var lit = daylight < 0.55;
            var win = lit
                ? "rgba(255, 210, 110, " + (0.5 + (1 - daylight) * 0.5) + ")"
                : "rgba(176, 220, 232, 0.96)";
            var frame = lit ? "rgba(92, 58, 28, 0.55)" : "rgba(255,255,255,0.9)";
            var rowStep = Math.max(7, bh * 0.17);
            var colStep = Math.max(6, bw * 0.23);
            var ww = Math.max(2.5, bw * 0.1);
            var wh = Math.max(3.5, bh * 0.085);
            var row;
            var col;
            for (row = base - bh + bh * 0.16; row < base - Math.min(bh * 0.12, 10); row += rowStep) {
                for (col = x + bw * 0.12; col < x + bw * 0.7; col += colStep) {
                    ctx.fillStyle = frame;
                    ctx.fillRect(col - 1, row - 1, ww + 2, wh + 2);
                    ctx.fillStyle = win;
                    ctx.fillRect(col, row, ww, wh);
                }
            }
        }

        function drawSpire(tx, base, s, top, daylight, stone) {
            ctx.fillStyle = paint(stone);
            ctx.fillRect(tx - s * 0.035, base - top, s * 0.07, top * 0.42);
            ctx.beginPath();
            ctx.moveTo(tx - s * 0.07, base - top);
            ctx.lineTo(tx, base - top - s * 0.34);
            ctx.lineTo(tx + s * 0.07, base - top);
            ctx.fill();
            if (sceneSnow) {
                ctx.fillStyle = "rgba(255,255,255,0.94)";
                ctx.beginPath();
                ctx.moveTo(tx - s * 0.08, base - top + s * 0.02);
                ctx.lineTo(tx, base - top - s * 0.34);
                ctx.lineTo(tx + s * 0.08, base - top + s * 0.02);
                ctx.fill();
            }
        }

        function drawParliament(cx, base, s, daylight) {
            var stone = mixColor([236, 220, 186], [58, 52, 72], daylight);
            var roof = mixColor([176, 72, 58], [48, 28, 36], daylight);
            var dome = mixColor([214, 148, 78], [92, 64, 48], daylight);
            var win = daylight < 0.55
                ? "rgba(255, 214, 120, " + (0.5 + (1 - daylight) * 0.5) + ")"
                : "rgba(150, 198, 214, 0.95)";
            var towers = [-1.05, -0.72, -0.38, 0.38, 0.72, 1.05];
            var c;
            var r;
            var rib;

            ctx.fillStyle = paint(stone);
            roundedRect(cx - s * 1.15, base - s * 0.92, s * 2.3, s * 0.92, 2);
            ctx.fill();
            ctx.fillStyle = paint(roof);
            ctx.fillRect(cx - s * 1.18, base - s * 1.02, s * 2.36, s * 0.1);
            if (sceneSnow) {
                ctx.fillStyle = "rgba(255,255,255,0.94)";
                ctx.fillRect(cx - s * 1.2, base - s * 1.1, s * 2.4, s * 0.1);
            }
            ctx.fillStyle = "rgba(255,255,255,0.16)";
            for (c = -5; c <= 5; c++) {
                ctx.fillRect(cx + c * s * 0.2, base - s * 0.88, 1.4, s * 0.78);
            }

            for (c = 0; c < towers.length; c++) {
                drawSpire(cx + towers[c] * s, base, s, s * 1.05, daylight, stone);
            }

            ctx.fillStyle = paint(stone);
            ctx.fillRect(cx - s * 0.42, base - s * 1.28, s * 0.84, s * 0.42);
            ctx.fillStyle = paint(dome);
            ctx.beginPath();
            ctx.arc(cx, base - s * 1.26, s * 0.4, Math.PI, 0);
            ctx.fill();
            ctx.strokeStyle = "rgba(255, 232, 190, 0.55)";
            ctx.lineWidth = Math.max(1, s * 0.025);
            for (rib = -2; rib <= 2; rib++) {
                ctx.beginPath();
                ctx.moveTo(cx + rib * s * 0.14, base - s * 1.26);
                ctx.quadraticCurveTo(cx + rib * s * 0.06, base - s * 1.5, cx, base - s * 1.64);
                ctx.stroke();
            }
            if (sceneSnow) {
                ctx.fillStyle = "rgba(255,255,255,0.92)";
                ctx.beginPath();
                ctx.arc(cx, base - s * 1.4, s * 0.24, Math.PI * 1.12, Math.PI * 1.88);
                ctx.fill();
            }
            ctx.fillStyle = paint(stone);
            ctx.fillRect(cx - s * 0.06, base - s * 1.78, s * 0.12, s * 0.16);
            ctx.fillStyle = paint(sceneSnow ? [236, 242, 246] : stone);
            ctx.beginPath();
            ctx.moveTo(cx - s * 0.04, base - s * 1.76);
            ctx.lineTo(cx, base - s * 2.35);
            ctx.lineTo(cx + s * 0.04, base - s * 1.76);
            ctx.fill();
            ctx.fillStyle = win;
            ctx.beginPath();
            ctx.arc(cx, base - s * 1.08, s * 0.07, 0, Math.PI * 2);
            ctx.fill();

            for (c = -4; c <= 4; c++) {
                if (c === 0) continue;
                for (r = 0; r < 4; r++) {
                    ctx.fillRect(cx + c * s * 0.22 - s * 0.035, base - s * 0.2 - r * s * 0.18, s * 0.07, s * 0.1);
                }
            }
            for (c = -1; c <= 1; c++) {
                ctx.beginPath();
                ctx.arc(cx + c * s * 0.16, base - s * 0.1, s * 0.055, Math.PI, 0);
                ctx.fill();
            }
        }

        function drawBridge(x, base, s, daylight) {
            var stone = mixColor([228, 210, 176], [52, 48, 58], daylight);
            var cable = mixColor([48, 52, 60], [220, 206, 170], daylight);
            var opening = mixColor([86, 164, 204], [12, 24, 42], daylight);
            var left = x + s * 0.16;
            var right = x + s * 1.3;
            var crown = base - s * 1.08;
            var sag = base - s * 0.7;
            var deck = base - s * 0.16;
            var hanger;
            var t;
            var px;
            var py;
            var span;

            ctx.fillStyle = paint(stone);
            ctx.fillRect(x, base - s * 1.15, s * 0.28, s * 1.15);
            ctx.fillRect(x + s * 1.18, base - s * 1.15, s * 0.28, s * 1.15);
            ctx.beginPath();
            ctx.moveTo(x - s * 0.02, base - s * 1.15);
            ctx.lineTo(x + s * 0.14, base - s * 1.62);
            ctx.lineTo(x + s * 0.3, base - s * 1.15);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + s * 1.16, base - s * 1.15);
            ctx.lineTo(x + s * 1.32, base - s * 1.62);
            ctx.lineTo(x + s * 1.48, base - s * 1.15);
            ctx.fill();
            ctx.fillStyle = paint(opening);
            ctx.beginPath();
            ctx.arc(x + s * 0.14, base - s * 0.22, s * 0.16, Math.PI, 0);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + s * 1.32, base - s * 0.22, s * 0.16, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = "rgba(255,244,220,0.85)";
            ctx.beginPath();
            ctx.arc(x + s * 0.14, base - s * 0.72, s * 0.045, 0, Math.PI * 2);
            ctx.arc(x + s * 1.32, base - s * 0.72, s * 0.045, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = paint(cable);
            ctx.lineWidth = Math.max(2, s * 0.045);
            ctx.beginPath();
            ctx.moveTo(left, crown);
            ctx.quadraticCurveTo(x + s * 0.73, sag, right, crown);
            ctx.stroke();
            ctx.lineWidth = 1;
            for (hanger = 1; hanger <= 7; hanger++) {
                t = hanger / 8;
                px = left + (right - left) * t;
                span = (1 - t) * (1 - t) * crown + 2 * (1 - t) * t * sag + t * t * crown;
                py = span;
                ctx.beginPath();
                ctx.moveTo(px, deck);
                ctx.lineTo(px, py);
                ctx.stroke();
            }
            ctx.fillStyle = paint(stone);
            ctx.fillRect(x - s * 0.02, deck, s * 1.5, s * 0.07);
            ctx.fillStyle = paint(mixColor([90, 98, 108], [20, 22, 28], daylight));
            ctx.fillRect(x, deck + s * 0.05, s * 1.46, s * 0.035);
            if (sceneSnow) {
                ctx.fillStyle = "rgba(255,255,255,0.94)";
                ctx.fillRect(x - s * 0.04, deck - s * 0.03, s * 1.54, s * 0.05);
            }
        }

        function drawTree(x, y, s, daylight) {
            if (s < 6) return;
            ctx.fillStyle = paint(mixColor([112, 74, 42], [36, 26, 18], daylight));
            ctx.fillRect(x - s * 0.07, y - s * 0.28, s * 0.14, s * 0.34);
            ctx.fillStyle = paint(mixColor([38, 150, 68], [14, 48, 32], daylight));
            ctx.beginPath();
            ctx.arc(x, y - s * 0.5, s * 0.34, 0, Math.PI * 2);
            ctx.arc(x - s * 0.22, y - s * 0.34, s * 0.26, 0, Math.PI * 2);
            ctx.arc(x + s * 0.22, y - s * 0.32, s * 0.24, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = paint(mixColor([112, 198, 86], [22, 72, 40], daylight));
            ctx.beginPath();
            ctx.arc(x + s * 0.04, y - s * 0.58, s * 0.16, 0, Math.PI * 2);
            ctx.fill();
            if (sceneSnow) {
                ctx.fillStyle = "rgba(255,255,255,0.92)";
                ctx.beginPath();
                ctx.arc(x, y - s * 0.62, s * 0.18, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawBoat(x, y, daylight) {
            if (daylight < 0.35) return;
            ctx.fillStyle = paint(mixColor([40, 70, 110], [20, 24, 36], daylight));
            ctx.beginPath();
            ctx.moveTo(x - 14, y);
            ctx.lineTo(x + 16, y);
            ctx.lineTo(x + 10, y + 6);
            ctx.lineTo(x - 8, y + 6);
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.95)";
            ctx.beginPath();
            ctx.moveTo(x + 1, y);
            ctx.lineTo(x + 1, y - 18);
            ctx.lineTo(x + 12, y - 2);
            ctx.fill();
        }

        function drawSky(daylight, date) {
            var top = sceneSnow ? [198, 220, 234] : (sceneRain ? [78, 98, 118] : mixColor([102, 188, 255], [6, 12, 36], daylight));
            var bottom = sceneSnow ? [226, 236, 242] : (sceneRain ? [156, 168, 178] : mixColor([255, 220, 156], [42, 58, 112], daylight));
            var sky = ctx.createLinearGradient(0, 0, 0, horizon + 20);
            sky.addColorStop(0, paint(top));
            sky.addColorStop(1, paint(bottom));
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, viewW, horizon + 30);

            if (!sceneRain && daylight < 0.85) {
                ctx.fillStyle = "rgba(255,255,255," + (0.9 * (1 - daylight)) + ")";
                var i;
                for (i = 0; i < 40; i++) {
                    ctx.fillRect((i * 97) % viewW, (i * 53) % (horizon * 0.72), 2, 2);
                }
            }

            if (!sceneRain) {
                drawCloud(viewW * 0.18, horizon * 0.22, 28, daylight);
                drawCloud(viewW * 0.62, horizon * 0.16, 36, daylight);
                drawCloud(viewW * 0.84, horizon * 0.3, 22, daylight);
            }

            var minutes = minutesOf(date);
            var across = (minutes - 6 * 60) / (14 * 60);
            if (across < 0) across = 0;
            if (across > 1) across = 1;
            var bodyX = viewW * (0.28 + across * 0.4);
            var bodyY = horizon * (0.62 - Math.sin(across * Math.PI) * 0.42);
            if (!sceneRain && !sceneSnow && daylight > 0.05) {
                var glow = ctx.createRadialGradient(bodyX, bodyY, 6, bodyX, bodyY, 64);
                glow.addColorStop(0, "rgba(255, 220, 90, " + daylight + ")");
                glow.addColorStop(1, "rgba(255, 220, 90, 0)");
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(bodyX, bodyY, 64, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ffe15a";
                ctx.beginPath();
                ctx.arc(bodyX, bodyY, 20, 0, Math.PI * 2);
                ctx.fill();
            }
            if (!sceneRain && daylight < 0.95) {
                ctx.fillStyle = "rgba(244, 236, 196, " + (1 - daylight) + ")";
                ctx.beginPath();
                ctx.arc(viewW * 0.34, Math.max(64, horizon * 0.2), 16, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function cityUnit() {
            return Math.max(30, Math.min(viewW, viewH) * (viewH > viewW ? 0.09 : 0.062));
        }

        function drawHills(daylight) {
            var base = horizon + 8;
            var rise = viewH * (viewH > viewW ? 0.1 : 0.12);
            var far = mixColor(sceneSnow ? [214, 226, 220] : [176, 210, 122], [22, 40, 34], daylight);
            var near = mixColor(sceneSnow ? [186, 206, 200] : [108, 176, 78], [14, 32, 26], daylight);
            ctx.fillStyle = paint(far);
            ctx.beginPath();
            ctx.moveTo(0, base);
            ctx.quadraticCurveTo(viewW * 0.12, base - rise * 1.65, viewW * 0.3, base - rise * 0.35);
            ctx.quadraticCurveTo(viewW * 0.52, base - rise * 1.05, viewW * 0.74, base - rise * 0.3);
            ctx.quadraticCurveTo(viewW * 0.9, base - rise * 0.8, viewW, base - rise * 0.2);
            ctx.lineTo(viewW, base + 6);
            ctx.lineTo(0, base + 6);
            ctx.fill();
            ctx.fillStyle = paint(near);
            ctx.beginPath();
            ctx.moveTo(0, base - 2);
            ctx.quadraticCurveTo(viewW * 0.22, base - rise * 0.55, viewW * 0.46, base + 2);
            ctx.quadraticCurveTo(viewW * 0.72, base - rise * 0.45, viewW, base - 6);
            ctx.lineTo(viewW, base + 10);
            ctx.lineTo(0, base + 10);
            ctx.fill();
        }

        function drawCity(daylight) {
            var base = horizon + 2;
            var u = cityUnit();
            var walls = [
                [244, 154, 92],
                [226, 96, 82],
                [248, 214, 150],
                [164, 198, 220],
                [236, 168, 140],
                [214, 186, 150],
                [232, 140, 96],
                [186, 176, 210]
            ];
            var roofs = [
                [186, 64, 50],
                [128, 46, 52],
                [168, 68, 54],
                [108, 58, 74],
                [154, 56, 48],
                [142, 62, 52],
                [176, 72, 56],
                [92, 64, 102]
            ];
            var i;
            var x;
            var h;
            var hillTop = horizon - viewH * 0.03;
            drawHouse(viewW * 0.0, hillTop, u * 1.25, u * 1.45, [236, 216, 176], [172, 62, 50], daylight);
            drawHouse(viewW * 0.1, hillTop, u * 0.95, u * 2.05, [246, 228, 196], [150, 54, 48], daylight);
            drawHouse(viewW * 0.18, hillTop, u * 1.1, u * 1.25, [228, 190, 148], [166, 68, 52], daylight);

            var count = Math.max(16, Math.round(viewW / (u * 0.78)));
            for (i = 0; i < count; i++) {
                x = (i + 0.02) * ((viewW - u * 0.4) / count);
                h = u * (x < viewW * 0.32 ? 1.05 + (i % 3) * 0.22 : 1.55 + ((i * 3) % 5) * 0.28);
                var paleWall = [
                    walls[i % walls.length][0] * 0.42 + 112,
                    walls[i % walls.length][1] * 0.42 + 128,
                    walls[i % walls.length][2] * 0.42 + 138
                ];
                drawHouse(x, base - u * 0.08, u * 0.7, h, paleWall, roofs[i % roofs.length], daylight);
            }

            var front = [
                [0.3, 1.05, 3.05, 2],
                [0.72, 1.05, 3.25, 0],
                [0.81, 0.95, 3.9, 1],
                [0.91, 1.02, 2.7, 4]
            ];
            for (i = 0; i < front.length; i++) {
                var row = front[i];
                drawHouse(viewW * row[0], base, u * row[1], u * row[2], walls[row[3]], roofs[row[3]], daylight);
            }

            drawParliament(viewW * 0.55, base, u * 2.15, daylight);
            drawSpire(viewW * 0.8, base, u * 1.15, u * 3.4, daylight, mixColor([232, 220, 196], [48, 44, 62], daylight));

            for (i = 0; i < count; i++) {
                x = (i + 0.4) * (viewW / count);
                drawTree(x, base + 2, u * (0.48 + (i % 4) * 0.08), daylight);
            }
        }

        function drawRiver(daylight) {
            var top = horizon - 8;
            var depth = Math.max(78, viewH * (viewH > viewW ? 0.125 : 0.09));
            var waterTop = sceneSnow ? [176, 198, 208] : (sceneRain ? [70, 96, 112] : [78, 176, 214]);
            var waterBottom = sceneSnow ? [146, 170, 184] : (sceneRain ? [48, 70, 86] : [32, 120, 182]);
            var water = ctx.createLinearGradient(0, top, 0, top + depth);
            water.addColorStop(0, paint(mixColor(waterTop, [16, 32, 64], daylight)));
            water.addColorStop(1, paint(mixColor(waterBottom, [8, 18, 40], daylight)));
            ctx.fillStyle = water;
            ctx.fillRect(0, top, viewW, depth);

            var shades = [
                [244, 168, 110],
                [232, 206, 160],
                [214, 150, 90],
                [186, 96, 78],
                [120, 176, 210]
            ];
            var col;
            var cols = Math.max(8, Math.round(viewW / 42));
            for (col = 0; col < cols; col++) {
                var shade = shades[col % shades.length];
                var rx = (col + 0.15) * (viewW / cols);
                var rw = viewW / cols * 0.62;
                var rh = depth * (0.5 + (col % 4) * 0.1);
                var alpha = daylight < 0.55 ? 0.16 + (1 - daylight) * 0.42 : (sceneSnow ? 0.12 : 0.2);
                var fade = ctx.createLinearGradient(0, top, 0, top + rh);
                fade.addColorStop(0, "rgba(" + shade[0] + "," + shade[1] + "," + shade[2] + "," + alpha + ")");
                fade.addColorStop(1, "rgba(" + shade[0] + "," + shade[1] + "," + shade[2] + ",0)");
                ctx.fillStyle = fade;
                ctx.fillRect(rx, top + 2, rw, rh);
            }

            ctx.strokeStyle = "rgba(255,255,255," + (0.28 * daylight + 0.08) + ")";
            ctx.lineWidth = 2;
            var wave;
            for (wave = 1; wave <= 3; wave++) {
                var y = top + depth * (0.24 * wave);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.bezierCurveTo(viewW * 0.28, y - 4, viewW * 0.62, y + 5, viewW, y - 2);
                ctx.stroke();
            }
            drawBoat(viewW * 0.32, top + depth * 0.4, daylight);
        }

        function drawBankTrees(daylight) {
            var y = horizon + viewH * (viewH > viewW ? 0.105 : 0.08);
            var u = cityUnit();
            var count = Math.max(7, Math.round(viewW / (u * 1.55)));
            var i;
            for (i = 0; i < count; i++) {
                var size = u * (1.15 + ((i * 3) % 4) * 0.22);
                var drop = ((i * 5) % 3) * u * 0.12;
                drawTree((i + 0.2) * (viewW / count), y + drop, size, daylight);
                if (i % 2 === 0) {
                    drawTree((i + 0.55) * (viewW / count), y + u * 0.35, size * 0.72, daylight);
                }
            }
        }

        function drawRoad(daylight) {
            ctx.beginPath();
            var a = roadPoint(0.02, -1);
            var b = roadPoint(1, -1);
            var c = roadPoint(1, 1);
            var d = roadPoint(0.02, 1);
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(a.x, a.y);
            ctx.lineTo(d.x, d.y);
            ctx.lineTo(c.x, c.y);
            ctx.closePath();
            ctx.fillStyle = paint(sceneSnow ? [186, 198, 208] : mixColor([78, 86, 98], [22, 26, 34], daylight));
            ctx.fill();

            ctx.strokeStyle = "rgba(255,255,255,0.9)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(roadPoint(0.05, -0.9).x, roadPoint(0.05, -0.9).y);
            ctx.lineTo(roadPoint(1, -0.92).x, roadPoint(1, -0.92).y);
            ctx.moveTo(roadPoint(0.05, 0.9).x, roadPoint(0.05, 0.9).y);
            ctx.lineTo(roadPoint(1, 0.92).x, roadPoint(1, 0.92).y);
            ctx.stroke();

            ctx.fillStyle = "rgba(0, 214, 255, 0.95)";
            ctx.shadowColor = "#00e5ff";
            ctx.shadowBlur = 12;
            var i;
            for (i = 0; i < 9; i++) {
                var t = (i / 9 + (roadOffset * 0.0035) % 1) % 1;
                if (t < 0.08) continue;
                var p0 = roadPoint(t, -0.045);
                var p1 = roadPoint(Math.min(0.98, t + 0.055), -0.07);
                var p2 = roadPoint(Math.min(0.98, t + 0.055), 0.07);
                var p3 = roadPoint(t, 0.045);
                ctx.beginPath();
                ctx.moveTo(p0.x, p0.y);
                ctx.lineTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineTo(p3.x, p3.y);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            ctx.strokeStyle = paint(mixColor([214, 220, 228], [70, 76, 86], daylight));
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(roadPoint(0.12, -1.08).x, roadPoint(0.12, -1.08).y);
            var step;
            for (step = 1; step <= 8; step++) {
                var rail = roadPoint(0.12 + step * 0.1, -1.08);
                ctx.lineTo(rail.x, rail.y);
            }
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(roadPoint(0.12, 1.08).x, roadPoint(0.12, 1.08).y);
            for (step = 1; step <= 8; step++) {
                var rightRail = roadPoint(0.12 + step * 0.1, 1.08);
                ctx.lineTo(rightRail.x, rightRail.y);
            }
            ctx.stroke();

            var sign = roadPoint(0.46, 1.28);
            ctx.save();
            ctx.translate(sign.x, sign.y);
            ctx.fillStyle = "#5c6570";
            ctx.fillRect(-2, -34, 4, 34);
            ctx.fillStyle = "#1f9d45";
            ctx.strokeStyle = "white";
            ctx.lineWidth = 3;
            roundedRect(-48, -58, 96, 28, 3);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "white";
            ctx.font = "bold 15px Trebuchet MS, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("Belváros", 6, -44);
            ctx.beginPath();
            ctx.moveTo(-34, -42);
            ctx.lineTo(-34, -50);
            ctx.lineTo(-24, -46);
            ctx.fill();
            ctx.restore();
        }

        function drawTrees(daylight) {
            var spots = [0.22, 0.36, 0.5, 0.64, 0.76];
            var n;
            var side;
            for (n = 0; n < spots.length; n++) {
                for (side = -1; side <= 1; side += 2) {
                    var p = roadPoint(spots[n], side * 1.55);
                    drawTree(p.x, p.y, 16 + spots[n] * 48, daylight);
                }
            }
        }

        function drawLamps(daylight) {
            if (daylight > 0.72) return;
            var i;
            for (i = 0; i < 7; i++) {
                var t = (i / 7 + (roadOffset * 0.002) % 1) % 1;
                if (t < 0.16) continue;
                var p = roadPoint(t, -1.2);
                var height = 10 + t * 28;
                ctx.strokeStyle = "rgba(40,40,48,0.8)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x, p.y - height);
                ctx.stroke();
                ctx.fillStyle = "rgba(255, 214, 110, " + ((1 - daylight) * (0.35 + t)) + ")";
                ctx.beginPath();
                ctx.arc(p.x, p.y - height, 2 + t * 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawCar() {
            var s = Math.max(0.78, Math.min(viewW, viewH) / 460);
            var x = viewW * 0.5;
            var y = viewH - (viewW < viewH ? 188 : 96);
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(s, s);
            ctx.fillStyle = "rgba(0,0,0,0.28)";
            ctx.beginPath();
            ctx.ellipse(0, 34, 58, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#171b22";
            roundedRect(-62, 6, 18, 30, 6);
            roundedRect(44, 6, 18, 30, 6);
            ctx.fill();
            ctx.fillStyle = "#2f86ea";
            roundedRect(-50, -10, 100, 44, 14);
            ctx.fill();
            ctx.fillStyle = "#c7ecff";
            roundedRect(-32, -6, 64, 16, 6);
            ctx.fill();
            ctx.fillStyle = "#e7eef5";
            roundedRect(-42, 26, 84, 8, 4);
            ctx.fill();
            ctx.fillStyle = "#ff3b45";
            ctx.shadowColor = "#ff3b45";
            ctx.shadowBlur = 8;
            roundedRect(-42, 8, 14, 8, 2);
            ctx.fill();
            roundedRect(28, 8, 14, 8, 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function drawSnow() {
            var flake;
            var shift = (roadOffset * 5) % 90;
            for (flake = 0; flake < 80; flake++) {
                var x = (flake * 47 + shift) % viewW;
                var y = (flake * 31 + shift * 2) % viewH;
                ctx.fillStyle = "rgba(255,255,255," + (0.7 + (flake % 3) * 0.1) + ")";
                ctx.beginPath();
                ctx.arc(x, y, 1.2 + (flake % 3), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawRain() {
            var drop;
            var shift = (roadOffset * 16) % 48;
            ctx.strokeStyle = "rgba(210, 226, 238, 0.55)";
            ctx.lineWidth = 1.4;
            for (drop = 0; drop < 90; drop++) {
                var x = (drop * 41 + shift) % viewW;
                var y = (drop * 67 + shift * 2) % viewH;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x - 4, y + 16);
                ctx.stroke();
            }
        }

        function frame() {
            var date = shownDate();
            var scene = sceneNow();
            var daylight = scene.daylight;
            sceneRain = scene.rain;
            sceneSnow = scene.snow;
            viewW = window.innerWidth;
            viewH = window.innerHeight;
            horizon = viewH * (viewH > viewW ? 0.43 : 0.48);
            roadOffset += 1.2;

            var grass = scene.snow
                ? [214, 228, 226]
                : mixColor([92, 186, 78], [14, 40, 28], daylight);
            ctx.fillStyle = paint(grass);
            ctx.fillRect(0, 0, viewW, viewH);
            drawSky(daylight, date);
            drawHills(daylight);
            drawCity(daylight);
            drawRiver(daylight);
            drawBridge(viewW * 0.02, horizon + 2, cityUnit() * 2.35, daylight);
            ctx.fillStyle = paint(grass);
            ctx.fillRect(0, horizon + viewH * (viewH > viewW ? 0.086 : 0.064), viewW, viewH);
            drawBankTrees(daylight);
            drawTrees(daylight);
            drawRoad(daylight);
            drawLamps(daylight);
            drawCar();
            if (scene.rain) {
                ctx.fillStyle = "rgba(72, 92, 112, 0.34)";
                ctx.fillRect(0, 0, viewW, viewH);
                drawCloud(viewW * 0.22, horizon * 0.18, 46, 1);
                drawCloud(viewW * 0.58, horizon * 0.12, 54, 1);
                drawCloud(viewW * 0.86, horizon * 0.24, 34, 1);
                drawRain();
            }
            if (scene.snow) drawSnow();
            updateHud(date, daylight, scene.rain, scene.snow);
            requestAnimationFrame(frame);
        }

        document.getElementById("peek").addEventListener("click", function () {
            if (previewMode === "night" || previewMode === "day") {
                previewMode = null;
                return;
            }
            previewMode = daylightFromDate(shownDate()) > 0.5 ? "night" : "day";
            previewUntil = Date.now() + 12000;
        });

        document.getElementById("rain").addEventListener("click", function () {
            if (previewMode === "rain") {
                previewMode = null;
                return;
            }
            previewMode = "rain";
            previewUntil = Date.now() + 12000;
        });

        document.getElementById("snow").addEventListener("click", function () {
            if (previewMode === "snow") {
                previewMode = null;
                return;
            }
            previewMode = "snow";
            previewUntil = Date.now() + 12000;
        });

        window.addEventListener("resize", resize);
        resize();
        requestAnimationFrame(frame);
    </script>
</body>
</html>
