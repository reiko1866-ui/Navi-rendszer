<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#14181e">
    <title>ToonNav3D</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #14181e;
            font-family: "Segoe UI", "Trebuchet MS", sans-serif;
            color: white;
        }
        #view { display: block; width: 100%; height: 100%; }
        #card {
            position: fixed;
            z-index: 2;
            left: 50%;
            bottom: calc(14px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            width: min(720px, calc(100% - 28px));
            box-sizing: border-box;
            padding: 22px 18px 16px;
            border-radius: 28px;
            background: rgba(22, 26, 32, 0.94);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            text-align: center;
        }
        #question {
            margin: 0 0 16px;
            font-size: clamp(20px, 4.6vw, 32px);
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        #choices { display: flex; gap: 12px; }
        button {
            flex: 1;
            min-height: 64px;
            border-radius: 999px;
            font: 700 22px "Segoe UI", "Trebuchet MS", sans-serif;
            touch-action: manipulation;
        }
        #nem {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.38);
        }
        #igen {
            background: #2ad4d8;
            color: #062428;
            border: 0;
        }
        #card.done #choices { display: none; }
        #card.done #question { margin-bottom: 4px; }
        #maneuver {
            position: fixed;
            z-index: 2;
            top: calc(12px + env(safe-area-inset-top));
            left: calc(12px + env(safe-area-inset-left));
            display: flex;
            gap: 10px;
            align-items: center;
            max-width: calc(100% - 96px);
            padding: 10px 14px;
            border-radius: 18px;
            background: rgba(22, 26, 32, 0.94);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
        }
        #arrow {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(42, 212, 216, 0.16);
            color: #2ad4d8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex: 0 0 auto;
        }
        #dist { font-size: clamp(20px, 4.5vw, 28px); font-weight: 800; line-height: 1; }
        #street { margin-top: 3px; font-size: 14px; color: #d5dde8; }
        #trip { margin-top: 2px; font-size: 13px; color: #9eb0c4; }
        #limit {
            position: fixed;
            z-index: 2;
            top: calc(12px + env(safe-area-inset-top));
            right: calc(12px + env(safe-area-inset-right));
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: white;
            border: 4px solid #e10600;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
        }
        #speed {
            position: fixed;
            z-index: 2;
            top: calc(76px + env(safe-area-inset-top));
            right: calc(12px + env(safe-area-inset-right));
            min-width: 64px;
            padding: 6px 8px 5px;
            border-radius: 14px;
            background: rgba(22, 26, 32, 0.94);
            text-align: center;
        }
        #speed b { display: block; font-size: 22px; line-height: 1; }
        #speed span { display: block; margin-top: 2px; font-size: 11px; color: #9eb0c4; }
        #map {
            position: fixed;
            z-index: 2;
            left: calc(12px + env(safe-area-inset-left));
            bottom: calc(196px + env(safe-area-inset-bottom));
            width: 124px;
            height: 124px;
            border-radius: 50%;
            border: 3px solid white;
            background: #143628;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>
<body>
    <canvas id="view"></canvas>
    <section id="maneuver">
        <div id="arrow">↱</div>
        <div>
            <div id="dist">250 m</div>
            <div id="street">Szabad út</div>
            <div id="trip">4,2 km · 12 perc</div>
        </div>
    </section>
    <div id="limit">50</div>
    <div id="speed"><b id="speed-num">8</b><span>km/h</span></div>
    <canvas id="map" width="248" height="248"></canvas>
    <section id="card">
        <p id="question">Ez dugó. Menjünk máshol?</p>
        <div id="choices">
            <button id="nem" type="button">Nem</button>
            <button id="igen" type="button">Igen</button>
        </div>
    </section>
    <script>
        var canvas = document.getElementById("view");
        var ctx = canvas.getContext("2d");
        var card = document.getElementById("card");
        var width = 1;
        var height = 1;
        var horizon = 200;
        var choice = "ask";
        var along = 0;
        var tripM = 4200;
        var nextM = 250;
        var speedKmh = 8;
        var cam = { x: 0, y: 1.85, z: 10.4 };
        var car = { x: 0, z: 3.6, yaw: 0 };
        var straight = line(0, 16, 0, -3, 8);
        var leftRoad = bend(-1);
        var rightRoad = bend(1);
        var queue = [0x3a4048, 0xd8d4cc, 0x8a3030, 0x22262c, 0xc8c2b8, 0x4a4038, 0x1c2026].map(function (color, index) {
            return { color: color, index: 3 + index * 2 };
        });

        document.getElementById("igen").addEventListener("click", function () { pick("yes"); });
        document.getElementById("nem").addEventListener("click", function () { pick("no"); });
        if (location.hash === "#igen") {
            pick("yes");
            along = 0.5;
        }
        if (location.hash === "#nem") pick("no");
        if (choice === "ask") speak("Ez dugó. Menjünk máshol?");

        window.addEventListener("resize", resize);
        resize();
        requestAnimationFrame(frame);

        function line(x1, z1, x2, z2, steps) {
            var points = [];
            var i;
            for (i = 0; i <= steps; i++) {
                var t = i / steps;
                points.push({ x: x1 + (x2 - x1) * t, z: z1 + (z2 - z1) * t });
            }
            return points;
        }

        function bend(side) {
            var points = [];
            var i;
            for (i = 0; i <= 24; i++) {
                var t = i / 24;
                points.push({
                    x: side * Math.pow(t, 1.55) * 13,
                    z: -3 - t * 36
                });
            }
            return points;
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            var ratio = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.max(1, Math.floor(width * ratio));
            canvas.height = Math.max(1, Math.floor(height * ratio));
            canvas.style.width = width + "px";
            canvas.style.height = height + "px";
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            horizon = height * (height > width ? 0.4 : 0.46);
        }

        function project(x, y, z) {
            var dx = x - cam.x;
            var dz = z - cam.z;
            var aheadX = -Math.sin(car.yaw);
            var aheadZ = -Math.cos(car.yaw);
            var rightX = Math.cos(car.yaw);
            var rightZ = -Math.sin(car.yaw);
            var depth = dx * aheadX + dz * aheadZ;
            if (depth < 1.4) return null;
            var side = dx * rightX + dz * rightZ;
            var focal = height * 0.92;
            var sx = width * 0.5 + side * focal / depth;
            var sy = horizon + (cam.y - y) * focal / depth;
            if (Math.abs(sx - width * 0.5) > width * 3 || Math.abs(sy) > height * 3) return null;
            return { x: sx, y: sy };
        }

        function poly(points, color, alpha) {
            if (points.some(function (point) { return !point; })) return;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            var i;
            for (i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        function ribbon(points, roadWidth, color, alpha) {
            var i;
            for (i = points.length - 2; i >= 0; i--) {
                var a = points[i];
                var b = points[i + 1];
                var dx = b.x - a.x;
                var dz = b.z - a.z;
                var len = Math.sqrt(dx * dx + dz * dz) || 1;
                var sideX = -dz / len * roadWidth * 0.5;
                var sideZ = dx / len * roadWidth * 0.5;
                poly([
                    project(a.x + sideX, 0, a.z + sideZ),
                    project(a.x - sideX, 0, a.z - sideZ),
                    project(b.x - sideX, 0, b.z - sideZ),
                    project(b.x + sideX, 0, b.z + sideZ)
                ], color, alpha);
            }
        }

        function face(corners, yaw, origin, color) {
            var points = corners.map(function (corner) {
                var x = origin.x + corner[0] * Math.cos(yaw) + corner[2] * Math.sin(yaw);
                var z = origin.z - corner[0] * Math.sin(yaw) + corner[2] * Math.cos(yaw);
                return project(x, corner[1], z);
            });
            poly(points, color, 1);
        }

        function drawCar(x, z, yaw, body, big) {
            var s = big ? 1.05 : 0.72;
            var origin = { x: x, z: z };
            face([[-0.85 * s, 0.22, 1.15 * s], [0.85 * s, 0.22, 1.15 * s], [0.85 * s, 0.95 * s, 1.15 * s], [-0.85 * s, 0.95 * s, 1.15 * s]], yaw, origin, body);
            face([[-0.62 * s, 0.95 * s, 0.15 * s], [0.62 * s, 0.95 * s, 0.15 * s], [0.48 * s, 1.28 * s, -0.3 * s], [-0.48 * s, 1.28 * s, -0.3 * s]], yaw, origin, "#1a2030");
            face([[-0.62 * s, 0.5, 1.18 * s], [-0.28 * s, 0.5, 1.18 * s], [-0.28 * s, 0.62, 1.18 * s], [-0.62 * s, 0.62, 1.18 * s]], yaw, origin, "#ff2430");
            face([[0.28 * s, 0.5, 1.18 * s], [0.62 * s, 0.5, 1.18 * s], [0.62 * s, 0.62, 1.18 * s], [0.28 * s, 0.62, 1.18 * s]], yaw, origin, "#ff2430");
        }

        function tree(x, z, scale) {
            var base = project(x, 0, z);
            var top = project(x, 1.6 * scale, z);
            if (!base || !top) return;
            var radius = Math.abs(base.y - top.y) * 0.55;
            ctx.fillStyle = "#15241c";
            ctx.beginPath();
            ctx.arc(top.x, top.y + radius * 0.35, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function sky() {
            var fade = ctx.createLinearGradient(0, 0, 0, height);
            fade.addColorStop(0, "#1a2233");
            fade.addColorStop(0.42, "#6a4a52");
            fade.addColorStop(0.72, "#d48968");
            fade.addColorStop(1, "#c98462");
            ctx.fillStyle = fade;
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = "#243028";
            ctx.fillRect(0, horizon, width, height - horizon);
        }

        function block(x, z, w, h, y, color) {
            poly([
                project(x - w * 0.5, y, z),
                project(x + w * 0.5, y, z),
                project(x + w * 0.5, y + h, z),
                project(x - w * 0.5, y + h, z)
            ], color, 1);
        }

        function dome(x, z, y, radius, color) {
            var center = project(x, y, z);
            var edge = project(x + radius, y, z);
            if (!center || !edge) return;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(center.x, center.y, Math.abs(edge.x - center.x), Math.PI, 0, true);
            ctx.fill();
        }

        function line3(ax, ay, az, bx, by, bz, color) {
            var a = project(ax, ay, az);
            var b = project(bx, by, bz);
            if (!a || !b) return;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
        }

        function city() {
            var i;
            for (i = -4; i <= 5; i++) {
                var h = 2.4 + (Math.abs(i * 3) % 5) * 0.7;
                block(-22 + i * 3.2, -44, 2.4, h, 0, i % 2 ? "#e7d3b0" : "#d7c4ae");
                block(-22 + i * 3.2, -44, 2.4, 0.45, h, "#8d4038");
            }
            block(-16, -50, 10, 3.2, 2.4, "#c4b49a");
            block(-16, -50, 3.2, 4.5, 5.2, "#d8c6a4");
            block(-18.2, -50, 0.35, 3.2, 9.4, "#f4efe4");
            block(-13.8, -50, 0.35, 2.6, 9.2, "#f4efe4");
            block(-8, -47, 1.1, 6.4, 0, "#efe4cc");
            block(-1.5, -47, 1.1, 6.4, 0, "#efe4cc");
            line3(-8, 6.2, -47, -1.5, 6.2, -47, "#3c4654");
            line3(-8, 5.2, -47, -4.8, 1.1, -47, "#3c4654");
            line3(-1.5, 5.2, -47, -4.8, 1.1, -47, "#3c4654");
            block(9, -56, 16, 4.4, 0, "#f4ead4");
            block(9, -56, 3.4, 3.6, 4.4, "#f7f0de");
            for (i = -5; i <= 5; i++) {
                if (i === 0) continue;
                block(9 + i * 1.35, -56, 0.28, 1.5, 4.5, "#f7f1e4");
            }
            dome(9, -56, 8.2, 2.3, "#d0893e");
            block(9, -56, 0.16, 2.4, 10.2, "#f8f4ea");
            block(18, -52, 4.2, 6.2, 0, "#f0e2c4");
            dome(18, -52, 6.4, 2.1, "#c9844a");
            block(18, -52, 0.7, 1.6, 8.2, "#f6f1e6");
        }

        function paint() {
            sky();
            city();
            tree(-10, -6, 2.2);
            tree(-13, -16, 2.5);
            tree(10, -10, 2);
            tree(13, -20, 2.3);
            ribbon(straight, 7.2, "#2c333c", 1);
            ribbon(leftRoad, 4.6, "#2c333c", 1);
            ribbon(rightRoad, 4.6, "#2c333c", 1);
            ribbon(leftRoad.slice(5), 1.2, "#ffb15a", 0.55);
            ribbon(rightRoad.slice(5), 1.35, "#2ad4d8", 0.72);
            ribbon(rightRoad.slice(5), 0.22, "#f4ffff", 0.95);
            var i;
            for (i = queue.length - 1; i >= 0; i--) {
                var spot = leftRoad[queue[i].index];
                var next = leftRoad[queue[i].index + 1];
                var yaw = Math.atan2(next.x - spot.x, next.z - spot.z) + Math.PI;
                var hex = queue[i].color.toString(16);
                while (hex.length < 6) hex = "0" + hex;
                drawCar(spot.x, spot.z, yaw, "#" + hex, false);
            }
            drawCar(car.x, car.z, car.yaw, "#d01218", true);
        }

        function pick(next) {
            if (choice !== "ask" && location.hash === "") return;
            choice = next;
            card.className = "done";
            var text = next === "yes" ? "Arra megyünk." : "Maradunk ezen az úton.";
            document.getElementById("question").textContent = text;
            if (location.hash === "") speak(text);
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            try {
                var voice = new SpeechSynthesisUtterance(text);
                voice.lang = "hu-HU";
                voice.rate = 0.96;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(voice);
            } catch (error) {
                return;
            }
        }

        function follow(yaw) {
            cam.x = car.x + Math.sin(yaw) * 6.6;
            cam.z = car.z + Math.cos(yaw) * 6.6;
        }

        function frame(time) {
            requestAnimationFrame(frame);
            if (!frame.last) frame.last = time;
            var dt = Math.min(0.05, (time - frame.last) / 1000);
            frame.last = time;
            if (choice === "yes") {
                along = Math.min(1, along + dt * 0.12);
                var index = Math.min(rightRoad.length - 2, Math.floor(along * (rightRoad.length - 2)));
                var spot = rightRoad[index];
                var next = rightRoad[index + 1];
                var local = along * (rightRoad.length - 2) - index;
                car.x = spot.x + (next.x - spot.x) * local;
                car.z = spot.z + (next.z - spot.z) * local;
                car.yaw = Math.atan2(next.x - spot.x, next.z - spot.z) + Math.PI;
                follow(car.yaw);
            }
            moveTrip(dt);
            paint();
            drawMap();
        }

        function drawMap() {
            var board = document.getElementById("map");
            var pen = board.getContext("2d");
            var size = 248;
            pen.clearRect(0, 0, size, size);
            pen.fillStyle = "#143628";
            pen.fillRect(0, 0, size, size);
            pen.fillStyle = "#2b6f96";
            pen.beginPath();
            pen.moveTo(78, 0);
            pen.bezierCurveTo(118, 70, 70, 160, 96, 248);
            pen.lineTo(132, 248);
            pen.bezierCurveTo(108, 160, 156, 70, 118, 0);
            pen.fill();
            pen.strokeStyle = "rgba(230, 242, 232, 0.35)";
            pen.lineWidth = 4;
            pen.beginPath();
            pen.moveTo(20, 90);
            pen.lineTo(220, 70);
            pen.moveTo(30, 150);
            pen.lineTo(210, 168);
            pen.stroke();
            var fork = { x: 132, y: 168 };
            var goal = { x: 168, y: 36 };
            var jam = { x: 78, y: 78 };
            var free = { x: 176, y: 118 };
            pen.lineCap = "round";
            pen.lineJoin = "round";
            pen.strokeStyle = "rgba(255,255,255,0.55)";
            pen.lineWidth = 8;
            pen.beginPath();
            pen.moveTo(132, 236);
            pen.lineTo(fork.x, fork.y);
            pen.stroke();
            pen.strokeStyle = choice === "no" ? "#ffb15a" : "rgba(255,255,255,0.35)";
            pen.beginPath();
            pen.moveTo(fork.x, fork.y);
            pen.quadraticCurveTo(90, 130, jam.x, jam.y);
            pen.stroke();
            pen.strokeStyle = choice === "no" ? "rgba(42,212,216,0.35)" : "#2ad4d8";
            pen.beginPath();
            pen.moveTo(fork.x, fork.y);
            pen.quadraticCurveTo(free.x, free.y, goal.x, goal.y);
            pen.stroke();
            pen.fillStyle = "#e7c56a";
            pen.beginPath();
            pen.arc(goal.x, goal.y, 8, 0, Math.PI * 2);
            pen.fill();
            var gone = Math.max(0, Math.min(1, (4200 - tripM) / 3400));
            var carX = fork.x;
            var carY = fork.y;
            if (choice === "yes") {
                carX = fork.x + (goal.x - fork.x) * gone;
                carY = fork.y + (goal.y - fork.y) * gone;
            } else if (choice === "no") {
                carX = fork.x + (jam.x - fork.x) * gone * 0.45;
                carY = fork.y + (jam.y - fork.y) * gone * 0.45;
            }
            pen.fillStyle = "#ff3b4a";
            pen.beginPath();
            pen.moveTo(carX, carY - 12);
            pen.lineTo(carX + 8, carY + 8);
            pen.lineTo(carX - 8, carY + 8);
            pen.fill();
            pen.fillStyle = "white";
            pen.font = "bold 18px Segoe UI, Trebuchet MS, sans-serif";
            pen.textAlign = "center";
            pen.fillText("N", 124, 22);
        }

        function moveTrip(dt) {
            if (choice === "yes") speedKmh = 42;
            else if (choice === "no") speedKmh = 6;
            else speedKmh = 8;
            var meters = speedKmh / 3.6 * dt;
            if (choice === "yes") {
                tripM = Math.max(80, tripM - meters);
                nextM = tripM;
            } else if (choice === "no") {
                tripM = Math.max(900, tripM - meters * 0.35);
                nextM = Math.max(40, nextM - meters * 0.2);
            } else {
                nextM = Math.max(40, nextM - meters * 0.15);
            }
            var showM = choice === "ask" ? nextM : tripM;
            var mins = Math.max(1, Math.round(tripM / (speedKmh / 3.6) / 60));
            var eta = new Date(Date.now() + mins * 60000);
            var minute = eta.getMinutes();
            if (minute < 10) minute = "0" + minute;
            document.getElementById("dist").textContent = formatMeters(showM);
            document.getElementById("trip").textContent = formatMeters(tripM) + " · " + mins + " perc · " + eta.getHours() + ":" + minute;
            document.getElementById("speed-num").textContent = String(Math.round(speedKmh));
            if (choice === "yes") {
                document.getElementById("arrow").textContent = "↑";
                document.getElementById("street").textContent = "Kossuth Lajos tér";
            } else if (choice === "no") {
                document.getElementById("arrow").textContent = "↑";
                document.getElementById("street").textContent = "Dugóban maradunk";
            }
        }

        function formatMeters(meters) {
            if (meters >= 1000) return (meters / 1000).toFixed(1).replace(".", ",") + " km";
            return Math.round(meters) + " m";
        }
    </script>
</body>
</html>
