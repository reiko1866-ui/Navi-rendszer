<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rajzolt kamiontérkép</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Sora:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sim.css">
</head>
<body>
  <div id="atlas">
    <header id="topbar">
      <div>
        <div class="eyebrow">Kamionszimulátor</div>
        <h1>Rajzolt kamiontérkép</h1>
      </div>
      <p class="hint">Az egész ország látszik. Az indulást és a célt is címmel keresheted. Az út berajzolódik.</p>
    </header>
    <div id="map-wrap">
      <canvas id="map"></canvas>
      <div id="legend">
        <div><i class="swatch motor"></i>autópálya</div>
        <div><i class="swatch main"></i>főút</div>
        <div><i class="swatch route"></i>útvonal</div>
      </div>
      <div id="zoomers">
        <button type="button" id="zin" aria-label="Nagyítás">+</button>
        <button type="button" id="zout" aria-label="Kicsinyítés">−</button>
        <button type="button" id="zfit" aria-label="Egész ország">ország</button>
      </div>
    </div>
    <form id="panel">
      <div id="summary">
        <strong id="headline">Útvonal</strong>
        <span id="subline"></span>
      </div>
      <label id="origin-label">Indulás
        <input id="from-q" type="search" placeholder="utca és város, például Váci utca, Budapest" autocomplete="off" enterkeyhint="search">
      </label>
      <ul id="from-hits" hidden></ul>
      <label id="search-label">Cél
        <input id="q" type="search" placeholder="utca és város, például Kossuth Lajos sugárút, Szeged" autocomplete="off" enterkeyhint="search">
      </label>
      <ul id="hits" hidden></ul>
      <p id="search-note" aria-live="polite"></p>
      <label id="to-label">Város a térképen
        <select id="to" name="to">
          <option value="">nem kötelező</option>
        </select>
      </label>
      <button type="submit" class="primary go" id="start">Indulás</button>
    </form>
  </div>

  <div id="cab" hidden>
    <div id="stage">
      <div id="glass">
        <canvas id="wind"></canvas>
        <div id="maneuver">
          <svg id="arrow" viewBox="0 0 46 46" aria-hidden="true"></svg>
          <div>
            <div class="km" id="man-km">—</div>
            <div class="where" id="man-where">Útvonal</div>
            <div class="road" id="man-road"></div>
          </div>
        </div>
      </div>
      <div id="gps">
        <div id="gps-tag">NAV</div>
        <canvas id="minimap"></canvas>
      </div>
    </div>
    <footer id="dash">
      <div id="speed"><b id="speed-num">0</b><small id="speed-unit">km/h</small></div>
      <div id="trip">
        <b id="remain">—</b>
        <small id="eta">érkezés</small>
      </div>
      <div id="scale-actions" role="group" aria-label="Idő gyorsítása">
        <button type="button" data-scale="8">8×</button>
        <button type="button" data-scale="40" aria-pressed="true">40×</button>
        <button type="button" data-scale="140">140×</button>
      </div>
      <div id="dash-actions">
        <button type="button" id="pause">Szünet</button>
        <button type="button" class="primary" id="to-map">Térkép</button>
      </div>
    </footer>
  </div>
  <script src="sim.js"></script>
</body>
</html>
