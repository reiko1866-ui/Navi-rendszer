<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2fbf4f">
    <title>ToonNav3D</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #8ecaf2;
            touch-action: none;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }
        #view { display: block; width: 100%; height: 100%; }
        .hud { position: fixed; z-index: 2; }
        #banner {
            top: calc(12px + env(safe-area-inset-top));
            left: calc(12px + env(safe-area-inset-left));
            right: calc(12px + env(safe-area-inset-right));
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 18px;
            background: #2fbf4f;
            color: white;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.16);
        }
        #arrow {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }
        #meters { font-size: 28px; font-weight: 800; line-height: 1; }
        #street { margin-top: 3px; font-size: 14px; font-weight: 600; opacity: 0.95; }
        #limit {
            left: calc(16px + env(safe-area-inset-left));
            bottom: calc(28px + env(safe-area-inset-bottom));
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: white;
            border: 5px solid #e10600;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
        }
        #speed {
            right: calc(16px + env(safe-area-inset-right));
            bottom: calc(36px + env(safe-area-inset-bottom));
            min-width: 74px;
            padding: 8px 12px 7px;
            border-radius: 16px;
            background: white;
            text-align: center;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.16);
        }
        #speed b {
            display: block;
            color: #e0232d;
            font-size: 32px;
            line-height: 1;
        }
        #speed span {
            display: block;
            margin-top: 2px;
            color: #8b93a0;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        body.night #banner {
            background: #101826;
            border: 2px solid #2ec8ff;
            box-shadow: 0 0 16px rgba(46, 200, 255, 0.25);
        }
        body.night #arrow { background: rgba(46, 200, 255, 0.15); color: #2ec8ff; }
        body.night #speed { background: #101826; }
        body.night #speed b,
        body.night #speed span { color: #3ad7ff; }
        #missing { position: fixed; inset: 24px; color: #123; font-size: 18px; }
    </style>
</head>
<body>
    <section id="banner" class="hud">
        <div id="arrow">
            <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 5 L7 12 L14 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div>
            <div id="meters">250 m</div>
            <div id="street">Fő út / Váci út</div>
        </div>
    </section>
    <div id="limit" class="hud">50</div>
    <div id="speed" class="hud"><b id="speed-num">0</b><span>KM/H</span></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        var banner = document.getElementById("banner");
        if (!window.THREE) {
            banner.hidden = true;
            document.getElementById("limit").hidden = true;
            document.getElementById("speed").hidden = true;
            var missing = document.createElement("p");
            missing.id = "missing";
            missing.textContent = "A kép nem indult el. Chrome-ban nyisd meg újra, internetkapcsolat kell.";
            document.body.appendChild(missing);
        } else {
            var treeColors = [0xb04bd6, 0xe23b4a, 0xf0a03a, 0xf2d23a, 0x3cb85a, 0x3aaee0, 0xef5b9a, 0x7a6cf0];
            var crowns = [];
            var bulbs = [];
            var laneMat = new THREE.MeshBasicMaterial({ color: 0x35d24c });
            var glowMat = new THREE.MeshBasicMaterial({ color: 0x39e7ff, transparent: true, opacity: 0 });
            var grassMat = new THREE.MeshLambertMaterial({ color: 0x7dce62 });
            var roadMat = new THREE.MeshLambertMaterial({ color: 0x3c424c });
            var scene = new THREE.Scene();
            var camera = new THREE.PerspectiveCamera(68, 1, 0.1, 280);
            var renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.domElement.id = "view";
            document.body.insertBefore(renderer.domElement, banner);

            scene.add(new THREE.HemisphereLight(0xe7f6ff, 0x67b85a, 0.85));
            scene.add(new THREE.AmbientLight(0xffffff, 0.35));
            var sun = new THREE.DirectionalLight(0xfff4d2, 0.85);
            sun.position.set(-20, 40, 10);
            scene.add(sun);

            var sky = document.createElement("canvas");
            sky.width = 4;
            sky.height = 256;
            var skyPen = sky.getContext("2d");
            var skyTex = new THREE.CanvasTexture(sky);
            scene.background = skyTex;

            var ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), grassMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.2;
            scene.add(ground);

            var road = new THREE.Mesh(new THREE.BoxGeometry(8.4, 0.16, 240), roadMat);
            scene.add(road);
            var lane = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.04, 240), laneMat);
            lane.position.set(-1.55, 0.1, -10);
            scene.add(lane);
            var glow = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.03, 240), glowMat);
            glow.position.set(-1.55, 0.08, -10);
            scene.add(glow);
            var dashZ;
            for (dashZ = -110; dashZ < 40; dashZ += 3.2) {
                addBox(scene, 0.14, 0.03, 1.15, -0.35, 0.12, dashZ, 0xf4f7fb, true);
                addBox(scene, 0.12, 0.03, 0.7, -1.55, 0.13, dashZ, 0xd8ffb0, true);
            }

            var z;
            var n = 0;
            for (z = -100; z <= 24; z += 4.6) {
                tree(-5.7, z, treeColors[n % treeColors.length]);
                tree(5.7, z + 2.1, treeColors[(n + 3) % treeColors.length]);
                n += 1;
            }
            for (z = -96; z <= 20; z += 9) {
                lamp(-4.35, z);
                lamp(4.35, z + 4);
            }

            var car = buildCar();
            car.position.set(1.15, 0, 6);
            scene.add(car);

            var mood = clockMood();
            var preview = !hourLocked();
            if (preview) mood = mood === "night" ? "day" : "night";
            applyMood();
            resize();
            camera.position.set(1.15, 3.15, car.position.z + 6.8);
            camera.lookAt(1.15, 0.7, car.position.z - 12);
            renderer.render(scene, camera);
            if (preview) {
                setTimeout(function () {
                    mood = clockMood();
                    applyMood();
                }, 7000);
            }
            setInterval(function () {
                if (hourLocked()) return;
                var next = clockMood();
                if (next !== mood) {
                    mood = next;
                    applyMood();
                }
            }, 20000);

            window.addEventListener("resize", resize);
            var clock = new THREE.Clock();
            var meters = 250;
            requestAnimationFrame(frame);
        }

        function hourLocked() {
            return /hour=\d/.test(window.location.href);
        }

        function clockMood() {
            var match = window.location.href.match(/hour=(\d{1,2})/);
            var hour = match ? Number(match[1]) : new Date().getHours();
            return hour >= 20 || hour < 7 ? "night" : "day";
        }

        function paintSky(top, mid, bottom) {
            var fade = skyPen.createLinearGradient(0, 0, 0, 256);
            fade.addColorStop(0, top);
            fade.addColorStop(0.42, mid);
            fade.addColorStop(1, bottom);
            skyPen.fillStyle = fade;
            skyPen.fillRect(0, 0, 4, 256);
            skyTex.needsUpdate = true;
        }

        function addBox(parent, w, h, d, x, y, z, color, basic) {
            var material = basic
                ? new THREE.MeshBasicMaterial({ color: color })
                : new THREE.MeshLambertMaterial({ color: color });
            var mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
            mesh.position.set(x, y, z);
            parent.add(mesh);
            return mesh;
        }

        function tree(x, z, color) {
            var group = new THREE.Group();
            addBox(group, 0.14, 0.7, 0.14, 0, 0.35, 0, 0x6b4630, false);
            var crown = new THREE.Mesh(
                new THREE.SphereGeometry(0.55, 12, 10),
                new THREE.MeshLambertMaterial({ color: color })
            );
            crown.position.y = 1.05;
            crown.userData.day = color;
            group.add(crown);
            crowns.push(crown);
            group.position.set(x, 0, z);
            scene.add(group);
        }

        function lamp(x, z) {
            var group = new THREE.Group();
            addBox(group, 0.08, 2.5, 0.08, 0, 1.25, 0, 0x9aa3ad, false);
            addBox(group, 0.72, 0.06, 0.06, x > 0 ? -0.28 : 0.28, 2.5, 0, 0x9aa3ad, false);
            var bulb = new THREE.Mesh(
                new THREE.SphereGeometry(0.16, 10, 8),
                new THREE.MeshBasicMaterial({ color: 0xfff1a8 })
            );
            bulb.position.set(x > 0 ? -0.62 : 0.62, 2.42, 0);
            group.add(bulb);
            bulbs.push(bulb);
            group.position.set(x, 0, z);
            scene.add(group);
        }

        function buildCar() {
            var group = new THREE.Group();
            addBox(group, 1.7, 0.48, 2.5, 0, 0.52, 0, 0xff3d4e, false);
            addBox(group, 1.35, 0.32, 1.15, 0, 0.88, -0.12, 0x2a3140, false);
            addBox(group, 1.15, 0.16, 0.06, 0, 0.9, 0.46, 0x1a2030, true);
            addBox(group, 0.34, 0.1, 0.06, -0.48, 0.58, 1.24, 0xff2a3a, true);
            addBox(group, 0.34, 0.1, 0.06, 0.48, 0.58, 1.24, 0xff2a3a, true);
            var wheelGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.18, 12);
            wheelGeo.rotateZ(Math.PI / 2);
            var wheelMat = new THREE.MeshLambertMaterial({ color: 0x1a1d24 });
            [[-0.86, 0.28, 0.78], [0.86, 0.28, 0.78], [-0.86, 0.28, -0.78], [0.86, 0.28, -0.78]].forEach(function (spot) {
                var wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(spot[0], spot[1], spot[2]);
                group.add(wheel);
            });
            return group;
        }

        function applyMood() {
            var night = mood === "night";
            document.body.className = night ? "night" : "";
            document.body.style.background = night ? "#070b14" : "#8ecaf2";
            var theme = document.querySelector('meta[name="theme-color"]');
            if (theme) theme.setAttribute("content", night ? "#101826" : "#2fbf4f");
            paintSky(night ? "#05070f" : "#8ecaf2", night ? "#12182a" : "#d5ecf8", night ? "#1a2438" : "#e7f3e4");
            scene.fog = new THREE.Fog(night ? 0x12182a : 0xd7eee4, 18, 78);
            grassMat.color.setHex(night ? 0x163224 : 0x7dce62);
            roadMat.color.setHex(night ? 0x232833 : 0x3c424c);
            laneMat.color.setHex(night ? 0x39e7ff : 0x35d24c);
            glowMat.opacity = night ? 0.45 : 0;
            sun.intensity = night ? 0.05 : 0.9;
            var i;
            for (i = 0; i < crowns.length; i++) {
                crowns[i].material.color.setHex(night ? 0x1d6a3c : crowns[i].userData.day);
            }
            for (i = 0; i < bulbs.length; i++) {
                bulbs[i].material.color.setHex(night ? 0xffe14a : 0xfff6c4);
            }
        }

        function resize() {
            var width = window.innerWidth;
            var height = window.innerHeight;
            camera.aspect = width / Math.max(height, 1);
            camera.fov = height > width ? 68 : 58;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function frame() {
            requestAnimationFrame(frame);
            var dt = Math.min(clock.getDelta(), 0.05);
            var units = 6 * dt;
            car.position.z -= units;
            if (car.position.z < -28) car.position.z += 40;
            meters -= units * 4.2;
            if (meters < 1) meters = 250;
            document.getElementById("meters").textContent = Math.ceil(meters) + " m";
            document.getElementById("speed-num").textContent = String(Math.round(28 + Math.sin(car.position.z) * 3));
            var behind = car.position.z + 6.8;
            camera.position.x += (1.15 - camera.position.x) * Math.min(1, dt * 3);
            camera.position.y += (3.15 - camera.position.y) * Math.min(1, dt * 3);
            camera.position.z += (behind - camera.position.z) * Math.min(1, dt * 3);
            camera.lookAt(1.15, 0.7, car.position.z - 12);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
