<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ToonNav3D</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #8ecaf2;
            touch-action: none;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }
        #view {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #night {
            position: fixed;
            z-index: 2;
            top: calc(12px + env(safe-area-inset-top));
            right: calc(12px + env(safe-area-inset-right));
            min-width: 112px;
            min-height: 48px;
            padding: 10px 16px;
            border: 0;
            border-radius: 24px;
            background: rgba(16, 32, 64, 0.9);
            color: white;
            font: 700 16px "Trebuchet MS", "Segoe UI", sans-serif;
        }
        #hint {
            position: fixed;
            z-index: 2;
            left: 50%;
            bottom: calc(12px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            margin: 0;
            padding: 8px 12px;
            border-radius: 16px;
            background: rgba(16, 32, 64, 0.72);
            color: white;
            font-size: 14px;
            white-space: nowrap;
        }
        #missing {
            position: fixed;
            inset: 24px;
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <button id="night" type="button">Éjszaka</button>
    <p id="hint">Bal vagy jobb oldal: kormány</p>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        var nightButton = document.getElementById("night");
        var hint = document.getElementById("hint");

        if (!window.THREE) {
            nightButton.hidden = true;
            hint.hidden = true;
            var missing = document.createElement("p");
            missing.id = "missing";
            missing.textContent = "A 3D nézet nem indult el. Chrome-ban nyisd meg újra, internetkapcsolat kell.";
            document.body.appendChild(missing);
        } else {
            var nightMode = wantsNight();
            var steerInput = 0;
            var steer = 0;
            var held = false;

            var scene = new THREE.Scene();
            var camera = new THREE.PerspectiveCamera(60, 1, 0.1, 250);
            var renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.domElement.id = "view";
            document.body.insertBefore(renderer.domElement, nightButton);

            var ambient = new THREE.AmbientLight(0xffffff, 0.72);
            var sun = new THREE.DirectionalLight(0xfff4d2, 1.05);
            sun.position.set(30, 50, 20);
            scene.add(ambient);
            scene.add(sun);

            var ground = new THREE.Mesh(
                new THREE.PlaneGeometry(240, 240),
                new THREE.MeshLambertMaterial({ color: 0x3d9a45 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.12;
            scene.add(ground);

            var road = new THREE.Mesh(
                new THREE.BoxGeometry(8, 0.2, 220),
                new THREE.MeshLambertMaterial({ color: 0x3c434c })
            );
            road.position.y = 0;
            scene.add(road);

            addStrip(3.72, 0.16, 0.12, 0xf2f5f8, false);
            addStrip(-3.72, 0.16, 0.12, 0xf2f5f8, false);
            addStrip(0, 0.18, 1.35, 0x00e5ff, true, 0.28);
            addStrip(0, 0.22, 0.42, 0x7af6ff, true, 1);

            var car = new THREE.Group();
            addBox(car, 1.45, 0.42, 2.5, 0, 0.58, 0, 0x2f86ea, false);
            addBox(car, 1.05, 0.38, 1.15, 0, 0.96, -0.12, 0x9ad7f8, false);
            addBox(car, 1.5, 0.12, 2.55, 0, 0.36, 0, 0x16304a, false);
            addBox(car, 0.22, 0.1, 0.06, -0.48, 0.62, 1.22, 0xff3b45, true);
            addBox(car, 0.22, 0.1, 0.06, 0.48, 0.62, 1.22, 0xff3b45, true);
            var wheelGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.18, 14);
            wheelGeo.rotateZ(Math.PI / 2);
            var wheelMat = new THREE.MeshLambertMaterial({ color: 0x1b1e24 });
            [[-0.72, 0.28, 0.78], [0.72, 0.28, 0.78], [-0.72, 0.28, -0.78], [0.72, 0.28, -0.78]].forEach(function (spot) {
                var wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(spot[0], spot[1], spot[2]);
                car.add(wheel);
            });
            car.position.set(0, 0, 30);
            scene.add(car);

            applySky();
            resize();

            window.addEventListener("resize", resize);
            window.addEventListener("pointerdown", onPointerDown);
            window.addEventListener("pointermove", onPointerMove);
            window.addEventListener("pointerup", onPointerUp);
            window.addEventListener("pointercancel", onPointerUp);
            nightButton.addEventListener("click", function (event) {
                event.stopPropagation();
                nightMode = !nightMode;
                applySky();
            });

            var clock = new THREE.Clock();
            requestAnimationFrame(frame);
        }

        function wantsNight() {
            var match = window.location.href.match(/hour=(\d{1,2})/);
            if (!match) {
                var hour = new Date().getHours();
                return hour >= 20 || hour < 7;
            }
            var hourValue = Number(match[1]);
            return hourValue >= 20 || hourValue < 7;
        }

        function addBox(parent, w, h, d, x, y, z, color, basic) {
            var material = basic
                ? new THREE.MeshBasicMaterial({ color: color })
                : new THREE.MeshLambertMaterial({ color: color });
            var mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
            mesh.position.set(x, y, z);
            parent.add(mesh);
            return mesh;
        }

        function addStrip(x, y, width, color, glow, opacity) {
            var material = new THREE.MeshBasicMaterial({
                color: color,
                transparent: glow,
                opacity: glow ? opacity : 1
            });
            var mesh = new THREE.Mesh(new THREE.BoxGeometry(width, 0.04, 220), material);
            mesh.position.set(x, y, 0);
            scene.add(mesh);
        }

        function applySky() {
            var sky = nightMode ? 0x0b1024 : 0x8ecaf2;
            var grass = nightMode ? 0x14301c : 0x3d9a45;
            scene.background = new THREE.Color(sky);
            scene.fog = new THREE.Fog(sky, 28, 120);
            ground.material.color.setHex(grass);
            ambient.intensity = nightMode ? 0.48 : 0.72;
            sun.intensity = nightMode ? 0.28 : 1.05;
            document.body.style.background = nightMode ? "#0b1024" : "#8ecaf2";
            nightButton.textContent = nightMode ? "Nappal" : "Éjszaka";
        }

        function resize() {
            var width = window.innerWidth;
            var height = window.innerHeight;
            camera.aspect = width / Math.max(height, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function onPointerDown(event) {
            if (event.target === nightButton) return;
            held = true;
            steerInput = event.clientX < window.innerWidth * 0.5 ? 1 : -1;
        }

        function onPointerMove(event) {
            if (!held || event.target === nightButton) return;
            steerInput = event.clientX < window.innerWidth * 0.5 ? 1 : -1;
        }

        function onPointerUp(event) {
            if (event.target === nightButton) return;
            held = false;
            steerInput = 0;
        }

        function frame() {
            requestAnimationFrame(frame);
            var dt = Math.min(clock.getDelta(), 0.05);
            steer += (steerInput - steer) * Math.min(1, dt * 5);
            car.rotation.y = steer * 0.45;
            var forwardX = -Math.sin(car.rotation.y);
            var forwardZ = -Math.cos(car.rotation.y);
            car.position.x += forwardX * 14 * dt;
            car.position.z += forwardZ * 14 * dt;
            car.position.x = Math.max(-2.5, Math.min(2.5, car.position.x));
            if (car.position.z < -70) car.position.z += 120;
            if (car.position.z > 70) car.position.z -= 120;

            var behindX = car.position.x - forwardX * 9;
            var behindZ = car.position.z - forwardZ * 9;
            camera.position.x += (behindX - camera.position.x) * Math.min(1, dt * 4);
            camera.position.y += (5.2 - camera.position.y) * Math.min(1, dt * 4);
            camera.position.z += (behindZ - camera.position.z) * Math.min(1, dt * 4);
            camera.lookAt(car.position.x + forwardX * 6, 1.1, car.position.z + forwardZ * 6);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
