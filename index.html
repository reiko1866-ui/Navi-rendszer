<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ToonNav3D</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #8ecaf2;
            touch-action: none;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: white;
        }
        #view { display: block; width: 100%; height: 100%; touch-action: none; }
        .hud { position: fixed; z-index: 2; touch-action: manipulation; }
        .card {
            background: rgba(16, 32, 64, 0.9);
            border-radius: 18px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.22);
            padding: 8px 12px;
        }
        #maneuver {
            top: calc(10px + env(safe-area-inset-top));
            left: calc(10px + env(safe-area-inset-left));
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #arrow {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .big { font-size: 18px; font-weight: 800; line-height: 1.05; }
        .small { font-size: 12px; color: #d7e2ef; }
        #weather {
            top: calc(10px + env(safe-area-inset-top));
            right: calc(10px + env(safe-area-inset-right));
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #weather .icon { font-size: 26px; }
        #limit {
            top: calc(74px + env(safe-area-inset-top));
            right: calc(18px + env(safe-area-inset-right));
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #e10600;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
        }
        #moods {
            left: 50%;
            bottom: calc(10px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
        }
        #moods button {
            min-height: 42px;
            padding: 8px 12px;
            border: 0;
            border-radius: 20px;
            background: rgba(16, 32, 64, 0.88);
            color: white;
            font: 700 14px "Trebuchet MS", "Segoe UI", sans-serif;
        }
        #moods button.on { background: #1f9d45; }
        #missing { position: fixed; inset: 24px; font-size: 18px; }
        @media (orientation: landscape) and (max-height: 460px) {
            .big { font-size: 16px; }
            #limit { width: 44px; height: 44px; font-size: 18px; top: 68px; }
        }
    </style>
</head>
<body>
    <section id="maneuver" class="hud card">
        <div id="arrow">↱</div>
        <div>
            <div class="big">2,3 km</div>
            <div class="small">Következő utca</div>
        </div>
    </section>
    <section id="weather" class="hud card">
        <div class="icon" id="weather-icon">☀️</div>
        <div>
            <div class="big" id="temp">22°C</div>
            <div class="small" id="weather-text">Enyhe szél</div>
        </div>
    </section>
    <div id="limit" class="hud">50</div>
    <div id="moods" class="hud">
        <button type="button" data-mood="day">Nappal</button>
        <button type="button" data-mood="night">Éjszaka</button>
        <button type="button" data-mood="rain">Eső</button>
        <button type="button" data-mood="snow">Hó</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        var moods = document.getElementById("moods");
        if (!window.THREE) {
            moods.hidden = true;
            var missing = document.createElement("p");
            missing.id = "missing";
            missing.textContent = "A 3D nézet nem indult el. Chrome-ban nyisd meg újra, internetkapcsolat kell.";
            document.body.appendChild(missing);
        } else {
            var mood = initialMood();
            var steerInput = 0;
            var steer = 0;
            var held = false;
            var snowCaps = [];
            var windowMat = new THREE.MeshBasicMaterial({ color: 0xb7e4f2 });
            var treeMat = new THREE.MeshLambertMaterial({ color: 0x2f9d4a });
            var roadMat = new THREE.MeshLambertMaterial({ color: 0x3c434c });
            var waterMat = new THREE.MeshLambertMaterial({ color: 0x2f92cf });

            var scene = new THREE.Scene();
            var camera = new THREE.PerspectiveCamera(68, 1, 0.1, 280);
            var renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.domElement.id = "view";
            document.body.insertBefore(renderer.domElement, document.getElementById("maneuver"));

            var hemi = new THREE.HemisphereLight(0xd7f0ff, 0x3d9a45, 0.55);
            var ambient = new THREE.AmbientLight(0xffffff, 0.45);
            var sun = new THREE.DirectionalLight(0xfff2c4, 1.05);
            sun.position.set(40, 60, 10);
            scene.add(hemi);
            scene.add(ambient);
            scene.add(sun);

            var sunBall = new THREE.Mesh(
                new THREE.SphereGeometry(3.2, 16, 12),
                new THREE.MeshBasicMaterial({ color: 0xffe15a })
            );
            sunBall.position.set(18, 28, -40);
            scene.add(sunBall);

            var ground = new THREE.Mesh(
                new THREE.PlaneGeometry(420, 420),
                new THREE.MeshLambertMaterial({ color: 0x3caf4a })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.2;
            scene.add(ground);

            var water = new THREE.Mesh(
                new THREE.BoxGeometry(22, 0.3, 360),
                waterMat
            );
            water.position.set(-18, -0.05, 0);
            scene.add(water);

            var road = new THREE.Mesh(new THREE.BoxGeometry(8, 0.2, 360), roadMat);
            road.position.y = 0;
            scene.add(road);
            addStrip(3.72, 0.16, 0.1, 0xf4f7fb, false);
            addStrip(-3.72, 0.16, 0.1, 0xf4f7fb, false);
            addStrip(0, 0.17, 1.15, 0x00d8ff, true, 0.32);
            addStrip(0, 0.21, 0.36, 0xd8fbff, true, 1);
            addStrip(4.35, 0.45, 0.08, 0xd5dbe3, false);
            addStrip(-4.35, 0.45, 0.08, 0xd5dbe3, false);

            buildWorld();

            var car = buildCar();
            car.position.set(0, 0, 28);
            scene.add(car);

            var flakes = buildFlakes();
            scene.add(flakes);

            applyMood();
            resize();
            window.addEventListener("resize", resize);
            window.addEventListener("pointerdown", onPointerDown);
            window.addEventListener("pointermove", onPointerMove);
            window.addEventListener("pointerup", onPointerUp);
            window.addEventListener("pointercancel", onPointerUp);
            moods.addEventListener("click", function (event) {
                var button = event.target.closest("button");
                if (!button) return;
                mood = button.getAttribute("data-mood");
                applyMood();
            });

            var clock = new THREE.Clock();
            requestAnimationFrame(frame);
        }

        function initialMood() {
            var address = window.location.href;
            if (address.indexOf("weather=rain") !== -1) return "rain";
            if (address.indexOf("weather=snow") !== -1) return "snow";
            return wantsNight() ? "night" : "day";
        }

        function wantsNight() {
            var match = window.location.href.match(/hour=(\d{1,2})/);
            var hour = match ? Number(match[1]) : new Date().getHours();
            return hour >= 20 || hour < 7;
        }

        function isHud(target) {
            return target.closest && target.closest(".hud");
        }

        function addBox(parent, w, h, d, x, y, z, color, basic) {
            var material = basic
                ? new THREE.MeshBasicMaterial({ color: color })
                : new THREE.MeshLambertMaterial({ color: color });
            var mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
            mesh.position.set(x, y, z);
            parent.add(mesh);
            return mesh;
        }

        function addStrip(x, y, width, color, glow, opacity) {
            var material = new THREE.MeshBasicMaterial({
                color: color,
                transparent: !!glow,
                opacity: glow ? opacity : 1
            });
            var mesh = new THREE.Mesh(new THREE.BoxGeometry(width, glow ? 0.05 : 0.08, 360), material);
            mesh.position.set(x, y, 0);
            scene.add(mesh);
        }

        function buildWorld() {
            var z;
            for (z = -180; z <= 180; z += 10) {
                tree(-5.6, z, 1);
                tree(5.7, z + 5, 1.15);
            }
            for (z = -180; z <= 180; z += 20) {
                house(-9.2, z, 2.2, 2.4 + (Math.abs(z) % 40) / 30, palette(z), roofColor(z));
                house(8.4, z + 8, 2.4, 2.1 + (Math.abs(z + 8) % 30) / 25, palette(z + 3), roofColor(z + 5));
            }
            for (z = -160; z <= 160; z += 120) {
                parliament(-16, z - 30);
                bridge(-18, z);
                sign(5.1, z + 16);
            }
        }

        function palette(n) {
            var colors = [0xf4a05a, 0xe15b4a, 0xf6d59a, 0x9fd0e4, 0xf0b090, 0xd7c2a4];
            return colors[Math.abs(n) % colors.length];
        }

        function roofColor(n) {
            var colors = [0xb44638, 0x8a3038, 0xc45a3a, 0x6e4468];
            return colors[Math.abs(n) % colors.length];
        }

        function house(x, z, w, h, wall, roof) {
            var group = new THREE.Group();
            addBox(group, w, h, w * 0.85, 0, h / 2, 0, wall, false);
            var cap = new THREE.Mesh(
                new THREE.ConeGeometry(w * 0.72, w * 0.55, 4),
                new THREE.MeshLambertMaterial({ color: roof })
            );
            cap.rotation.y = Math.PI / 4;
            cap.position.y = h + w * 0.22;
            group.add(cap);
            var snow = new THREE.Mesh(
                new THREE.ConeGeometry(w * 0.5, w * 0.28, 4),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            snow.rotation.y = Math.PI / 4;
            snow.position.y = h + w * 0.42;
            snow.visible = false;
            group.add(snow);
            snowCaps.push(snow);
            addBox(group, 0.28, 0.36, 0.28, w * 0.22, h + w * 0.15, 0, 0x7a5344, false);
            var row;
            var col;
            for (row = 0; row < 2; row++) {
                for (col = -1; col <= 1; col += 2) {
                    var win = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.36, 0.04), windowMat);
                    win.position.set(col * w * 0.22, h * 0.35 + row * h * 0.28, w * 0.43);
                    group.add(win);
                }
            }
            group.position.set(x, 0, z);
            scene.add(group);
        }

        function tree(x, z, scale) {
            var group = new THREE.Group();
            addBox(group, 0.18 * scale, 0.7 * scale, 0.18 * scale, 0, 0.35 * scale, 0, 0x6d4a30, false);
            var crown = new THREE.Mesh(new THREE.SphereGeometry(0.55 * scale, 8, 6), treeMat);
            crown.position.y = 0.95 * scale;
            group.add(crown);
            var cap = new THREE.Mesh(
                new THREE.SphereGeometry(0.28 * scale, 8, 6),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            cap.position.y = 1.2 * scale;
            cap.visible = false;
            group.add(cap);
            snowCaps.push(cap);
            group.position.set(x, 0, z);
            scene.add(group);
        }

        function parliament(x, z) {
            var group = new THREE.Group();
            addBox(group, 8, 2.4, 3.2, 0, 1.2, 0, 0xf0e2c4, false);
            addBox(group, 2.2, 3.2, 2.2, 0, 2.2, 0, 0xf3e6cc, false);
            var dome = new THREE.Mesh(
                new THREE.SphereGeometry(1.35, 16, 12),
                new THREE.MeshLambertMaterial({ color: 0xd3924e })
            );
            dome.position.y = 4.3;
            group.add(dome);
            var spire = new THREE.Mesh(
                new THREE.ConeGeometry(0.16, 1.6, 8),
                new THREE.MeshLambertMaterial({ color: 0xf4ead4 })
            );
            spire.position.y = 6.1;
            group.add(spire);
            var i;
            for (i = -3; i <= 3; i++) {
                if (i === 0) continue;
                var tower = new THREE.Mesh(
                    new THREE.ConeGeometry(0.18, 0.9, 4),
                    new THREE.MeshLambertMaterial({ color: 0xf4ead4 })
                );
                tower.position.set(i * 1.05, 2.8, 0);
                group.add(tower);
                var win = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.32, 0.05), windowMat);
                win.position.set(i * 1.05, 1.3, 1.62);
                group.add(win);
            }
            group.position.set(x, 0, z);
            scene.add(group);
        }

        function bridge(x, z) {
            var group = new THREE.Group();
            addBox(group, 0.7, 3.4, 0.7, -4.2, 1.7, 0, 0xe6d7b8, false);
            addBox(group, 0.7, 3.4, 0.7, 4.2, 1.7, 0, 0xe6d7b8, false);
            addBox(group, 10, 0.28, 1.3, 0, 0.7, 0, 0xd9c7a4, false);
            var cable = new THREE.Mesh(
                new THREE.TorusGeometry(4.6, 0.05, 6, 24, Math.PI),
                new THREE.MeshBasicMaterial({ color: 0x4c5360 })
            );
            cable.rotation.z = Math.PI;
            cable.rotation.y = Math.PI / 2;
            cable.position.y = 3.3;
            group.add(cable);
            group.position.set(x, 0, z);
            scene.add(group);
        }

        function sign(x, z) {
            var group = new THREE.Group();
            addBox(group, 0.08, 1.5, 0.08, 0, 0.75, 0, 0x66707a, false);
            var canvas = document.createElement("canvas");
            canvas.width = 256;
            canvas.height = 96;
            var pen = canvas.getContext("2d");
            pen.fillStyle = "#1f9d45";
            pen.fillRect(0, 0, 256, 96);
            pen.strokeStyle = "#ffffff";
            pen.lineWidth = 8;
            pen.strokeRect(6, 6, 244, 84);
            pen.fillStyle = "#ffffff";
            pen.font = "bold 40px Trebuchet MS, sans-serif";
            pen.textAlign = "center";
            pen.textBaseline = "middle";
            pen.fillText("Belváros", 128, 50);
            var board = new THREE.Mesh(
                new THREE.PlaneGeometry(2.2, 0.82),
                new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) })
            );
            board.position.y = 1.55;
            group.add(board);
            group.position.set(x, 0, z);
            scene.add(group);
        }

        function buildCar() {
            var group = new THREE.Group();
            addBox(group, 1.55, 0.48, 2.7, 0, 0.62, 0, 0x2f86ea, false);
            addBox(group, 1.15, 0.4, 1.25, 0, 1.02, -0.15, 0xb7e7fb, false);
            addBox(group, 0.9, 0.28, 0.06, 0, 1.02, 0.48, 0x16344e, true);
            addBox(group, 1.62, 0.14, 2.8, 0, 0.36, 0, 0x16304a, false);
            addBox(group, 0.28, 0.12, 0.08, -0.5, 0.68, 1.32, 0xff3340, true);
            addBox(group, 0.28, 0.12, 0.08, 0.5, 0.68, 1.32, 0xff3340, true);
            var wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 14);
            wheelGeo.rotateZ(Math.PI / 2);
            var wheelMat = new THREE.MeshLambertMaterial({ color: 0x1b1e24 });
            [[-0.78, 0.3, 0.85], [0.78, 0.3, 0.85], [-0.78, 0.3, -0.85], [0.78, 0.3, -0.85]].forEach(function (spot) {
                var wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(spot[0], spot[1], spot[2]);
                group.add(wheel);
            });
            return group;
        }

        function buildFlakes() {
            var count = 280;
            var positions = new Float32Array(count * 3);
            var i;
            for (i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 24;
                positions[i * 3 + 1] = Math.random() * 14;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 24;
            }
            var geometry = new THREE.BufferGeometry();
            geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
            return new THREE.Points(
                geometry,
                new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, transparent: true, opacity: 0.9 })
            );
        }

        function applyMood() {
            var sky = 0x8ecaf2;
            var grass = 0x3caf4a;
            var waterColor = 0x2f92cf;
            var roadColor = 0x3c434c;
            var treeColor = 0x2f9d4a;
            var icon = "☀️";
            var temp = "22°C";
            var label = "Enyhe szél";
            var night = mood === "night";
            sunBall.visible = mood === "day";
            flakes.visible = mood === "rain" || mood === "snow";
            flakes.material.color.setHex(mood === "rain" ? 0xd5e4ee : 0xffffff);
            flakes.material.size = mood === "rain" ? 0.12 : 0.22;
            if (night) {
                sky = 0x10183a;
                grass = 0x143222;
                waterColor = 0x12345c;
                treeColor = 0x1d6a38;
                icon = "🌙";
                temp = "12°C";
                label = "Tiszta égbolt";
            } else if (mood === "rain") {
                sky = 0x73889a;
                grass = 0x2f6d42;
                waterColor = 0x56788c;
                roadColor = 0x2c333b;
                treeColor = 0x2a7a40;
                icon = "🌧️";
                temp = "16°C";
                label = "Eső";
            } else if (mood === "snow") {
                sky = 0xd5e4ee;
                grass = 0xdfe8ea;
                waterColor = 0xb7c9d4;
                roadColor = 0xc5d0d8;
                treeColor = 0x8fbf78;
                icon = "❄️";
                temp = "-2°C";
                label = "Havazás";
            }
            scene.background = new THREE.Color(sky);
            scene.fog = new THREE.Fog(sky, night ? 24 : 36, night ? 110 : 150);
            ground.material.color.setHex(grass);
            waterMat.color.setHex(waterColor);
            roadMat.color.setHex(roadColor);
            treeMat.color.setHex(treeColor);
            windowMat.color.setHex(night ? 0xffd27a : 0xb7e4f2);
            ambient.intensity = night ? 0.35 : mood === "rain" ? 0.4 : 0.5;
            sun.intensity = night ? 0.15 : mood === "rain" ? 0.35 : 1.05;
            hemi.intensity = night ? 0.2 : 0.55;
            document.body.style.background = "#" + scene.background.getHexString();
            document.getElementById("weather-icon").textContent = icon;
            document.getElementById("temp").textContent = temp;
            document.getElementById("weather-text").textContent = label;
            var buttons = moods.querySelectorAll("button");
            var index;
            for (index = 0; index < buttons.length; index++) {
                buttons[index].className = buttons[index].getAttribute("data-mood") === mood ? "on" : "";
            }
            var cap;
            for (cap = 0; cap < snowCaps.length; cap++) snowCaps[cap].visible = mood === "snow";
        }

        function resize() {
            var width = window.innerWidth;
            var height = window.innerHeight;
            camera.aspect = width / Math.max(height, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function onPointerDown(event) {
            if (isHud(event.target)) return;
            held = true;
            steerInput = event.clientX < window.innerWidth * 0.5 ? 1 : -1;
        }

        function onPointerMove(event) {
            if (!held || isHud(event.target)) return;
            steerInput = event.clientX < window.innerWidth * 0.5 ? 1 : -1;
        }

        function onPointerUp(event) {
            if (isHud(event.target)) return;
            held = false;
            steerInput = 0;
        }

        function frame() {
            requestAnimationFrame(frame);
            var dt = Math.min(clock.getDelta(), 0.05);
            steer += (steerInput - steer) * Math.min(1, dt * 5);
            car.rotation.y = steer * 0.4;
            var forwardX = -Math.sin(car.rotation.y);
            var forwardZ = -Math.cos(car.rotation.y);
            car.position.x += forwardX * 16 * dt;
            car.position.z += forwardZ * 16 * dt;
            car.position.x = Math.max(-2.4, Math.min(2.4, car.position.x));
            if (car.position.z < -80) car.position.z += 120;
            if (car.position.z > 40) car.position.z -= 120;

            if (flakes.visible) {
                var positions = flakes.geometry.attributes.position;
                var count = positions.count;
                var fall = (mood === "rain" ? 16 : 4) * dt;
                var i;
                for (i = 0; i < count; i++) {
                    var y = positions.getY(i) - fall;
                    if (y < 0) y = 14;
                    positions.setY(i, y);
                }
                positions.needsUpdate = true;
                flakes.position.set(car.position.x, 0, car.position.z - 6);
            }

            var behindX = car.position.x - forwardX * 8;
            var behindZ = car.position.z - forwardZ * 8;
            camera.position.x += (behindX - camera.position.x) * Math.min(1, dt * 4);
            camera.position.y += (4.2 - camera.position.y) * Math.min(1, dt * 4);
            camera.position.z += (behindZ - camera.position.z) * Math.min(1, dt * 4);
            camera.lookAt(car.position.x + forwardX * 8, 1.3, car.position.z + forwardZ * 8);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
