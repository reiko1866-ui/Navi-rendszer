<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rajzfilmes Navigáció - Magyarország</title>
    <!-- MapLibre GL JS CSS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #ffeb3b; font-family: 'Comic Neue', cursive, sans-serif;
        }
        
        #map { 
            width: 100%; height: 100%; position: absolute; top: 0; left: 0; 
            /* Itt varázsoljuk igazi rajzfilmes, élénk, rajzolt stílusúvá a térképet! */
            filter: saturate(2.2) contrast(1.3) brightness(1.05);
        }
        
        /* Rajzfilmes felső kereső sáv */
        #top-bar {
            position: absolute; top: 20px; left: 20px; right: 20px;
            z-index: 10; display: flex;
        }
        input {
            width: 100%; padding: 16px 20px; font-size: 20px; border-radius: 20px;
            border: 4px solid #111; background: #fffde7; color: #111;
            box-shadow: 0 6px 0px #111; outline: none; font-weight: bold;
            font-family: 'Comic Neue', cursive, sans-serif;
        }
        input::placeholder { color: #666; }

        /* Rajzfilmes stílusú alsó státusz doboz */
        #status-box {
            position: absolute; bottom: 25px; left: 20px; right: 20px;
            background: #ff5722; color: #fff; padding: 16px;
            border: 4px solid #111; border-radius: 20px; font-size: 18px; font-weight: bold;
            text-align: center; box-shadow: 0 6px 0px #111; z-index: 10;
            text-shadow: 2px 2px 0px #111;
        }

        /* Rajzfilmes autó ikon a térképen */
        .cartoon-car {
            width: 54px; height: 54px;
            background-color: #4caf50;
            border: 4px solid #111;
            border-radius: 50% 50% 30% 30%;
            box-shadow: 0 6px 0px #111;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <input type="text" id="search-input" placeholder="Hová utazunk, főnök? 🚗💨">
    </div>

    <div id="map"></div>

    <div id="status-box">🗺️ Rajzfilmes Magyarország betöltve! GPS keresése...</div>

    <!-- MapLibre GL JS Script -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'osm': {
                        type: 'raster',
                        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                        tileSize: 256,
                        attribution: '&copy; OpenStreetMap'
                    }
                },
                layers: [{
                    id: 'osm-layer',
                    type: 'raster',
                    source: 'osm',
                    minzoom: 0,
                    maxzoom: 19
                }]
            },
            center: [19.5033, 47.1625],
            zoom: 7,
            pitch: 30
        });

        let userMarker = null;

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const lng = position.coords.longitude;
                    const lat = position.coords.latitude;
                    const speed = position.coords.speed ? (position.coords.speed * 3.6) : 0;
                    const currentPos = [lng, lat];

                    document.getElementById('status-box').innerText = `🚗 Sebesség: ${speed.toFixed(1)} km/h | Úton!`;

                    if (userMarker) {
                        userMarker.setLngLat(currentPos);
                    } else {
                        const el = document.createElement('div');
                        el.className = 'cartoon-car';
                        el.innerHTML = '🚙';
                        userMarker = new maplibregl.Marker({ element: el }).setLngLat(currentPos).addTo(map);
                        
                        map.flyTo({ center: currentPos, zoom: 16, pitch: 45 });
                    }

                    if (speed > 3) {
                        map.setCenter(currentPos);
                    }
                },
                (err) => {
                    document.getElementById('status-box').innerText = "⚠️ Várjuk a GPS jelet Magyarországon...";
                },
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
            );
        } else {
            document.getElementById('status-box').innerText = "❌ A böngésző nem támogatja a GPS-t.";
        }
    </script>
</body>
</html>
