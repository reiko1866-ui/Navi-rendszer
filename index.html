<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rajzfilmes 3D Navigáció v2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; background: #81d4fa; font-family: 'Comic Neue', cursive, sans-serif;
            user-select: none; -webkit-user-select: none;
        }

        #gameCanvas {
            display: block; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 1;
        }

        /* Felső navigációs sáv */
        #top-bar {
            position: fixed; top: 15px; left: 15px; right: 15px;
            z-index: 10; display: flex; gap: 10px; align-items: center; pointer-events: none;
        }
        #instruction-box {
            flex: 1; background: #2ecc71; border: 3px solid #111;
            border-radius: 16px; padding: 10px 16px; display: flex; align-items: center; gap: 14px;
            box-shadow: 0 4px 0px #111; font-size: 20px; font-weight: bold; color: #fff;
            pointer-events: auto;
        }
        .icon-btn {
            background: #2ecc71; border: 3px solid #111; border-radius: 16px;
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; box-shadow: 0 4px 0px #111; cursor: pointer; color: #fff;
            pointer-events: auto;
        }

        /* Alsó műszerfal elemek */
        #limit-gauge {
            position: fixed; bottom: 20px; left: 20px; z-index: 10;
            width: 70px; height: 70px; background: #ff334b; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 0px #111; color: #fff; font-size: 26px; font-weight: bold;
            border: 3px solid #111;
        }

        #speed-gauge {
            position: fixed; bottom: 20px; right: 20px; z-index: 10;
            width: 70px; height: 70px; background: #ffffff; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 5px 0px #111; color: #222; border: 3px solid #111;
        }
        .speed-val { font-size: 24px; font-weight: bold; line-height: 1; color: #ff334b; }
        .speed-unit { font-size: 9px; font-weight: bold; color: #666; margin-top: 2px; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div id="instruction-box">
            <span style="font-size: 24px;">⬅️</span>
            <div>
                <div style="font-size: 20px;" id="distance-text">250 m</div>
                <div style="font-size: 12px; font-weight: normal; opacity: 0.9;" id="street-text">Fő út / Váci út</div>
            </div>
        </div>
        <div class="icon-btn">🔍</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="limit-gauge">50</div>
    <div id="speed-gauge">
        <span class="speed-val" id="speed-val">0</span>
        <span class="speed-unit">KM/H</span>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let currentSpeed = 0;
        let roadOffset = 0;
        let isNight = false;

        function updateTheme() {
            const hour = new Date().getHours();
            isNight = (hour < 6 || hour >= 18);
        }
        updateTheme();

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                if (position.coords.speed !== null) {
                    currentSpeed = Math.round(position.coords.speed * 3.6);
                } else {
                    currentSpeed = 3; 
                }
                document.getElementById('speed-val').innerText = currentSpeed;
            }, () => {
                currentSpeed = 3;
            }, { enableHighAccuracy: true });
        }

        function render() {
            const width = canvas.width;
            const height = canvas.height;

            // Égvonal és föld
            ctx.fillStyle = isNight ? '#070a0f' : '#81d4fa';
            ctx.fillRect(0, 0, width, height * 0.45);

            ctx.fillStyle = isNight ? '#0c1410' : '#81c784';
            ctx.fillRect(0, height * 0.45, width, height * 0.55);

            const horizonY = height * 0.45;
            const roadWidthBottom = width * 0.8;
            const roadWidthTop = width * 0.08;

            roadOffset += (currentSpeed + 2) * 0.035;
            const curve = Math.sin(roadOffset * 0.03) * (width * 0.2);

            ctx.beginPath();
            ctx.moveTo((width - roadWidthBottom) / 2, height);
            ctx.bezierCurveTo(
                width / 2 + curve * 0.4, horizonY + (height - horizonY) * 0.5,
                width / 2 + curve, horizonY + (height - horizonY) * 0.15,
                (width - roadWidthTop) / 2 + curve * 0.05, horizonY
            );
            ctx.lineTo((width + roadWidthTop) / 2 + curve * 0.05, horizonY);
            ctx.bezierCurveTo(
                width / 2 + curve, horizonY + (height - horizonY) * 0.15,
                width / 2 + curve * 0.4, horizonY + (height - horizonY) * 0.5,
                (width + roadWidthBottom) / 2, height
            );
            ctx.closePath();

            ctx.fillStyle = isNight ? '#1e2229' : '#37474f';
            ctx.fill();

            // Középső sáv
            ctx.beginPath();
            const centerTopX = width / 2 + curve * 0.05;
            const centerBottomX = width / 2;
            ctx.moveTo(centerBottomX - 6, height);
            ctx.lineTo(centerTopX - 2, horizonY);
            ctx.lineTo(centerTopX + 2, horizonY);
            ctx.lineTo(centerBottomX + 6, height);
            ctx.closePath();
            ctx.fillStyle = isNight ? '#00e5ff' : '#2ecc71';
            if (isNight) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00e5ff';
            }
            ctx.fill();
            ctx.shadowBlur = 0;

            // Szaggatott vonalak
            ctx.fillStyle = '#ffffff';
            const dashCount = 12;
            for (let i = 0; i < dashCount; i++) {
                let p = (i / dashCount + (roadOffset * 0.025) % 1) % 1;
                let py = horizonY + p * (height - horizonY);
                let pw = Math.max(2, p * 5);
                let px = width / 2 + curve * 0.05 * p;
                ctx.fillRect(px - pw * 0.5, py, pw, p * 18);
            }

            // Fák / Lámpák
            const itemCount = 10;
            const treeColors = ['#ab47bc', '#ef5350', '#ffca28', '#42a5f5', '#26a69a'];
            for (let i = 0; i < itemCount; i++) {
                let progress = (i / itemCount + (roadOffset * 0.007) % 1) % 1;
                let y = horizonY + progress * (height - horizonY);
                let xFactor = (width * 0.38) * (1 - progress);

                if (isNight) {
                    drawLamp(width / 2 - roadWidthBottom * 0.5 - xFactor - 20, y, progress);
                    drawLamp(width / 2 + roadWidthBottom * 0.5 + xFactor + 20, y, progress);
                } else {
                    drawTree(width / 2 - roadWidthBottom * 0.5 - xFactor - 20, y, progress, treeColors[i % treeColors.length]);
                    drawTree(width / 2 + roadWidthBottom * 0.5 + xFactor + 20, y, progress, treeColors[(i + 2) % treeColors.length]);
                }
            }

            // Autó fixen alul
            drawPlayerCar(width / 2, height - 60);

            requestAnimationFrame(render);
        }

        function drawLamp(x, y, scale) {
            let size = Math.max(3, scale * 20);
            ctx.fillStyle = '#111';
            ctx.fillRect(x - 2, y - size * 1.8, 3, size * 1.8);
            ctx.beginPath();
            ctx.arc(x, y - size * 1.8, Math.max(2.5, size * 0.25), 0, Math.PI * 2);
            ctx.fillStyle = '#ffeb3b';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffeb3b';
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawTree(x, y, scale, color) {
            let size = Math.max(4, scale * 22);
            ctx.fillStyle = '#5d4037';
            ctx.fillRect(x - size * 0.15, y - size * 0.6, size * 0.3, size * 0.6);
            ctx.beginPath();
            ctx.arc(x, y - size * 0.9, size * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawPlayerCar(cx, cy) {
            ctx.save();
            ctx.translate(cx, cy);

            ctx.fillStyle = '#111';
            ctx.fillRect(-75, -5, 20, 30);
            ctx.fillRect(55, -5, 20, 30);

            ctx.fillStyle = '#ff334b';
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(-65, -25, 130, 55, 12);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.roundRect(-45, -45, 90, 28, 8);
            ctx.fill();

            ctx.restore();
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
