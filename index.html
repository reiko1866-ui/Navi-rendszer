        };
        var backs = {
            day: "#8ecaf2",
            rain: "#667f93",
            night: "#071426",
            snow: "#c9d7e0"
        };

        function minutesOf(date) {
            return date.getHours() * 60 + date.getMinutes() + date.getSeconds() / 60;
        }

        function daylightFromDate(date) {
            var minutes = minutesOf(date);
            var sunrise = 6 * 60;
            var day = 7 * 60;
            var sunset = 19 * 60;
            var night = 20 * 60;
            if (minutes >= day && minutes < sunset) return 1;
            if (minutes >= night || minutes < sunrise) return 0;
            if (minutes >= sunrise && minutes < day) return (minutes - sunrise) / 60;
            return 1 - (minutes - sunset) / 60;
        }

        function shownDate() {
            var match = window.location.href.match(/hour=(\d{1,2})/);
            if (!match) return new Date();
            var forced = new Date();
            var hour = Number(match[1]);
            if (hour >= 0 && hour <= 23) forced.setHours(hour, 0, 0, 0);
            return forced;
        }

        function pageWants(name) {
            return window.location.href.indexOf("weather=" + name) !== -1;
        }

        function panelName() {
            if (pageWants("rain")) return "rain";
            if (pageWants("snow")) return "snow";
            return daylightFromDate(shownDate()) >= 0.5 ? "day" : "night";
        }

        function show() {
            var name = panelName();
            var scene = document.getElementById("scene");
            if (scene.getAttribute("data-panel") === name) return;
            scene.src = pictures[name];
            scene.setAttribute("data-panel", name);
            document.body.style.background = backs[name];
            scene.style.background = backs[name];
        }

        show();
        setInterval(show, 30000);
    </script>
