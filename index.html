<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rajzfilmes 3D Navigáció</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #81c784; font-family: 'Comic Neue', cursive, sans-serif;
            user-select: none;
        }

        #gameCanvas {
            display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;
        }

        /* Felső navigációs sáv (mint a fotón) */
        #top-bar {
            position: absolute; top: 15px; left: 15px; right: 15px;
            z-index: 10; display: flex; gap: 10px; align-items: center;
        }
        #instruction-box {
            flex: 1; background: #2ecc71; border: none;
            border-radius: 16px; padding: 12px 18px; display: flex; align-items: center; gap: 14px;
            box-shadow: 0 4px 0px rgba(0,0,0,0.2); font-size: 20px; font-weight: bold; color: #fff;
        }
        .icon-btn {
            background: #2ecc71; border: none; border-radius: 16px;
            width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; box-shadow: 0 4px 0px rgba(0,0,0,0.2); cursor: pointer; color: #fff;
        }

        /* Alsó műszerfal elemek */
        #limit-gauge {
            position: absolute; bottom: 20px; left: 20px; z-index: 10;
            width: 75px; height: 75px; background: #ff334b; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 0px rgba(0,0,0,0.2); color: #fff; font-size: 30px; font-weight: bold;
            border: 4px solid #fff;
        }

        #speed-gauge {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            width: 75px; height: 75px; background: #ffffff; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 6px 0px rgba(0,0,0,0.2); color: #222;
        }
        .speed-val { font-size: 26px; font-weight: bold; line-height: 1; color: #ff334b; }
        .speed-unit { font-size: 10px; font-weight: bold; color: #666; margin-top: 2px; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div id="instruction-box">
            <span style="font-size: 26px;">⬅️</span>
            <div>
                <div style="font-size: 22px;" id="distance-text">250 m</div>
                <div style="font-size: 13px; font-weight: normal; opacity: 0.9;" id="street-text">Fő út / Váci út</div>
            </div>
        </div>
        <div class="icon-btn">🔍</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="limit-gauge">50</div>
    <div id="speed-gauge">
        <span class="speed-val" id="speed-val">0</span>
        <span class="speed-unit">KM/H</span>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let currentSpeed = 0;
        let roadOffset = 0;
        let isNight = false;

        // Automatikus nappali / éjszakai mód ellenőrzés (6:00 - 18:00 nappal, egyébként éjjel)
        function updateTheme() {
            const hour = new Date().getHours();
            isNight = (hour < 6 || hour >= 18);
        }
        setInterval(updateTheme, 10000);
        updateTheme();

        // Valós GPS sebesség lekérdezés
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                if (position.coords.speed !== null) {
                    currentSpeed = Math.round(position.coords.speed * 3.6);
                } else {
                    currentSpeed = 2; // Alap mozgás szimuláció teszteléshez
                }
                document.getElementById('speed-val').innerText = currentSpeed;
            }, () => {
                currentSpeed = 2;
            }, { enableHighAccuracy: true });
        }

        function render() {
            const width = canvas.width;
            const height = canvas.height;

            // 1. ÉGBOLT
            if (isNight) {
                const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.45);
                skyGrad.addColorStop(0, '#070a0f');
                skyGrad.addColorStop(1, '#1b2838');
                ctx.fillStyle = skyGrad;
            } else {
                const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.45);
                skyGrad.addColorStop(0, '#81d4fa');
                skyGrad.addColorStop(1, '#e1f5fe');
                ctx.fillStyle = skyGrad;
            }
            ctx.fillRect(0, 0, width, height * 0.45);

            // 2. FÖLD / FÜVES TERÜLET
            ctx.fillStyle = isNight ? '#142318' : '#81c784';
            ctx.fillRect(0, height * 0.45, width, height * 0.55);

            // 3. ÚT ÉS PERSPEKTÍVA
            const horizonY = height * 0.45;
            const roadWidthBottom = width * 0.7;
            const roadWidthTop = width * 0.08;

            roadOffset += (currentSpeed + 2) * 0.03;
            const curve = Math.sin(roadOffset * 0.03) * (width * 0.18);

            ctx.beginPath();
            ctx.moveTo((width - roadWidthBottom) / 2, height);
            ctx.bezierCurveTo(
                width / 2 + curve * 0.4, horizonY + (height - horizonY) * 0.5,
                width / 2 + curve, horizonY + (height - horizonY) * 0.15,
                (width - roadWidthTop) / 2 + curve * 0.1, horizonY
            );
            ctx.lineTo((width + roadWidthTop) / 2 + curve * 0.1, horizonY);
            ctx.bezierCurveTo(
                width / 2 + curve, horizonY + (height - horizonY) * 0.15,
                width / 2 + curve * 0.4, horizonY + (height - horizonY) * 0.5,
                (width + roadWidthBottom) / 2, height
            );
            ctx.closePath();

            // Aszfalt háttér
            ctx.fillStyle = isNight ? '#222629' : '#37474f';
            ctx.fill();

            // Középső világító sáv (nappal zöld, éjjel neon kék/zöld)
            ctx.beginPath();
            const centerTopX = width / 2 + curve * 0.1;
            const centerBottomX = width / 2;
            ctx.moveTo(centerBottomX - 10, height);
            ctx.lineTo(centerTopX - 3, horizonY);
            ctx.lineTo(centerTopX + 3, horizonY);
            ctx.lineTo(centerBottomX + 10, height);
            ctx.closePath();
            ctx.fillStyle = isNight ? '#00e5ff' : '#2ecc71';
            if (isNight) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00e5ff';
            }
            ctx.fill();
            ctx.shadowBlur = 0;

            // Szaggatott fehér vonalak a középső sávban
            ctx.fillStyle = '#ffffff';
            const dashCount = 12;
            for (let i = 0; i < dashCount; i++) {
                let p = (i / dashCount + (roadOffset * 0.02) % 1) % 1;
                let py = horizonY + p * (height - horizonY);
                let pw = Math.max(2, p * 8);
                let px = width / 2 + curve * 0.1 * p;
                ctx.fillRect(px - pw * 0.5, py, pw, p * 25);
            }

            // 4. SZÍNES FÁK ÉS ÚTSZÉLI LÁMPÁK
            const treeColors = ['#ab47bc', '#ef5350', '#ffca28', '#42a5f5', '#26a69a'];
            const itemCount = 9;
            for (let i = 0; i < itemCount; i++) {
                let progress = (i / itemCount + (roadOffset * 0.006) % 1) % 1;
                let y = horizonY + progress * (height - horizonY);
                let xFactor = (width * 0.35) * (1 - progress);

                // Bal oldal
                drawSceneryItem(width / 2 - roadWidthBottom * 0.5 - xFactor - 25, y, progress, treeColors[i % treeColors.length], isNight);
                // Jobb oldal
                drawSceneryItem(width / 2 + roadWidthBottom * 0.5 + xFactor + 25, y, progress, treeColors[(i + 2) % treeColors.length], isNight);
            }

            // 5. PIROS AUTÓ HÁTULNÉZETBŐL
            drawPlayerCar(width / 2, height - 70);

            requestAnimationFrame(render);
        }

        function drawSceneryItem(x, y, scale, color, nightMode) {
            let size = Math.max(6, scale * 32);

            if (nightMode) {
                // Éjszaka: lámpatestek az út szélén sárga izzóval
                ctx.fillStyle = '#37474f';
                ctx.fillRect(x - 2, y - size * 2, 4, size * 2);

                ctx.beginPath();
                ctx.arc(x, y - size * 2, Math.max(3, size * 0.35), 0, Math.PI * 2);
                ctx.fillStyle = '#ffeb3b';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ffeb3b';
                ctx.fill();
                ctx.shadowBlur = 0;
            } else {
                // Nappal: színes rajzfilmes fák
                // Törzs
                ctx.fillStyle = '#5d4037';
                ctx.fillRect(x - size * 0.15, y - size * 0.8, size * 0.3, size * 0.8);
                // Lombkorona
                ctx.beginPath();
                ctx.arc(x, y - size * 1.1, size * 0.6, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
            }
        }

        function drawPlayerCar(cx, cy) {
            ctx.save();
            ctx.translate(cx, cy);

            // Kerekek
            ctx.fillStyle = '#222';
            ctx.fillRect(-95, 10, 25, 45);
            ctx.fillRect(70, 10, 25, 45);

            // Piros kasztni
            ctx.fillStyle = '#ff334b';
            ctx.beginPath();
            ctx.roundRect(-80, -20, 160, 80, 16);
            ctx.fill();

            // Tető / Hátsó szélvédő
            ctx.fillStyle = '#263238';
            ctx.beginPath();
            ctx.roundRect(-60, -45, 120, 40, 12);
            ctx.fill();

            ctx.restore();
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
